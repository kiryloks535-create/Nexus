  if(se&&sleepHours(se)>=(state.settings.sleepTarget||8))out.push({t:'b',h:t('buff_rest')});
  const od=state.tasks.filter(x=>!x.done&&x.date<td).length;

function importData(inp){

  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      if(!parsed||!parsed.schemaVersion||!Array.isArray(parsed.goals)||!Array.isArray(parsed.skills)) throw new Error('schema');
      state=migrate(parsed); _tIdx=null; state.goals.forEach(g=>delete g._c);
      saveState(); applySettings(); emitChange(); toast(t('imp_ok'));
    }catch(e){ toast(t('imp_bad'),{amber:true}); }

/* ============================================================
   ☁ CLOUD SYNC (GitHub) — телефон ↔ ноутбук через приватный репозиторий.
   Файл состояния лежит в api.github.com Contents; мерж как в LAN-синке.
   Токен НИКУДА не выгружается: из снапшота для облака он вырезается.
   ============================================================ */
function cgReady(){ const c=state.settings.cloud||{}; return !!(c.token&&c.repo); }
function cgApi(){ const c=state.settings.cloud; return 'https://api.github.com/repos/'+c.repo+'/contents/'+encodeURIComponent(c.file||'nexus-state.json'); }
function cgHeaders(){ return {Authorization:'Bearer '+state.settings.cloud.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; }
function cgStatus(){
  if(!cgReady())return 'не настроено — вставь репозиторий и токен выше и нажми Сохранить';
  const t=localStorage.getItem(KEY+'-cloudAt');
  return 'подключено · последняя синхронизация: '+(t?new Date(+t).toLocaleString('ru-RU'):'ещё не было');
}
function cgSave(){
  state.settings.cloud=state.settings.cloud||{};
  state.settings.cloud.repo=$('#cg-repo').value.trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/i,'').replace(/\/+$/,'');
  state.settings.cloud.token=$('#cg-token').value.trim();
  state.settings.cloud.file=($('#cg-file').value.trim()||'nexus-state.json').replace(/^\/+/,'');
  state.settings.cloud.auto=$('#cg-auto').checked;
  emitChange(); // перерисовка → статус обновится
  if(!state.settings.cloud.repo){ toast('☁ Впиши РЕПОЗИТОРИЙ (имя/репозиторий) — серый текст в поле это подсказка, а не значение',{amber:true,ms:7000}); return; }
  if(!state.settings.cloud.token){ toast('☁ Впиши ТОКЕН (github_pat_…) из GitHub → Settings → Developer settings',{amber:true,ms:7000}); return; }
  toast('☁ Облако: настройки сохранены');
  if(state.settings.cloud.auto)cloudPull(false); // автосинк стартует сразу, без перезагрузки страницы
}
function b64utf8(s){ return btoa(unescape(encodeURIComponent(s))); }
let _cgT=null,_cgBusy=false;
function scheduleCloudPush(){ if(!cgReady()||!(state.settings.cloud||{}).auto)return; clearTimeout(_cgT); _cgT=setTimeout(()=>cloudPush(false),4000); }
function applyCloudState(m){
  const keepTok=(state.settings.cloud||{}).token, keepFt=(state.settings.fintrack||{}).token;
  state=migrate(m); _tIdx=null; state.goals.forEach(g=>delete g._c);
  if(keepTok){ state.settings.cloud=state.settings.cloud||{}; state.settings.cloud.token=keepTok; } // токен живёт только локально
  if(keepFt){ state.settings.fintrack=state.settings.fintrack||{}; state.settings.fintrack.token=keepFt; }
  try{ state._savedAt=Date.now(); localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
  applySettings(); renderNav(); renderTopbar(); renderView();
}
async function cloudGet(){ // {sha,state} | null (файла нет)
  const r=await fetch(cgApi(),{headers:cgHeaders(),cache:'no-store'});
  if(r.status===404)return null;
  if(r.status===401)throw new Error('токен неверный или истёк (401)');
  if(!r.ok)throw new Error('GitHub API '+r.status);
  const j=await r.json();
  let txt='';
  try{ txt=decodeURIComponent(escape(atob(String(j.content||'').replace(/\s/g,'')))); }catch(e){ throw new Error('в облаке не JSON'); }
  const st=JSON.parse(txt);
  if(!st||!st.schemaVersion||!Array.isArray(st.goals))throw new Error('в облаке чужой файл');
  return {sha:j.sha,state:st};
}
async function cloudPush(manual){
  if(!cgReady()){
    if(manual){
      const c=state.settings.cloud||{};
      toast('☁ '+(c.token?'Впиши РЕПОЗИТОРИЙ (имя/репозиторий) — серый текст в поле это подсказка':'Впиши ТОКЕН (github_pat_…)')+' — Настройки → Облако',{amber:true,ms:7000});
    }
    return false;
  }
  if(_cgBusy)return false; _cgBusy=true;
  try{
    const cur=await cloudGet().catch(()=>null);
    const snap=JSON.parse(JSON.stringify(state));
    if(snap.settings&&snap.settings.cloud)snap.settings.cloud.token='';    // токен не покидает устройство
    if(snap.settings&&snap.settings.fintrack)snap.settings.fintrack.token='';
    const cgSig=s=>JSON.stringify([s.tasks,s.goals,s.xpLog,(s.finance||{}).transactions,(s.finance||{}).workLog,s.skills,s.categories,s.status,(s.train||{}).log,(s.train||{}).miles]);
    if(cur&&cur.state&&cgSig(cur.state)===cgSig(snap)){ // без содержательных изменений — не спамим коммитами
      try{ localStorage.setItem(KEY+'-cloudAt',String(Date.now())); }catch(e){}
      if(manual)toast('☁ Облако уже актуально'); return true;
    }
    const put=sha=>fetch(cgApi(),{method:'PUT',headers:cgHeaders(),body:JSON.stringify({message:'NEXUS sync',content:b64utf8(JSON.stringify(snap)),sha})});
    let r=await put(cur?cur.sha:undefined);
    if(r.status===409){ // файл обновил другое устройство: тянем, мержим, повторяем
      const p=await cloudGet(); if(p)applyCloudState(mergeState(state,p.state));
      const snap2=JSON.parse(JSON.stringify(state));
      if(snap2.settings&&snap2.settings.cloud)snap2.settings.cloud.token='';
      const cur2=await cloudGet();
      r=await put(cur2?cur2.sha:undefined);
    }
    if(!r.ok)throw new Error('GitHub API '+r.status);
    try{ localStorage.setItem(KEY+'-cloudAt',String(Date.now())); }catch(e){}
    if(manual)toast('☁ Выгружено в облако');
    return true;
  }catch(e){ if(manual)toast('☁ Облако: '+e.message,{amber:true}); return false; }
  finally{ _cgBusy=false; }
}
async function cloudPull(manual){
  if(!manual&&(!(state.settings.cloud||{}).auto||!cgReady()))return false; // авто-режим: только когда включён и настроен
  if(!cgReady()){
    if(manual){
      const c=state.settings.cloud||{};
      toast('☁ '+(c.token?'Впиши РЕПОЗИТОРИЙ (имя/репозиторий) — серый текст в поле это подсказка':'Впиши ТОКЕН (github_pat_…)')+' — Настройки → Облако',{amber:true,ms:7000});
    }
    return false;
  }
  try{
    const cur=await cloudGet();
    if(!cur){ if(manual)toast('☁ В облаке пусто — выгружаю локальные данные'); await cloudPush(false); return true; }
    const sig=s=>JSON.stringify([s.tasks,s.goals,s.xpLog,(s.finance||{}).transactions,(s.finance||{}).workLog,s.skills,s.categories]);
    if(sig(state)===sig(cur.state)){ if(manual)toast('☁ Облако уже актуально'); return false; }
    applyCloudState(mergeState(state,cur.state));
    try{ localStorage.setItem(KEY+'-cloudAt',String(Date.now())); }catch(e){}
    if(manual)toast('☁ Данные из облака загружены');
    return true;
  }catch(e){ if(manual)toast('☁ Облако: '+e.message,{amber:true}); return false; }
}

/* ============================================================
   SECTION 18.5 — TRAINING «Боец-190» (12-week plan module)
   XP: тренировка +25 (sk-fit/sk-combat +10), мобильность +10 (+5),
   сон/белок +5. Одна награда в день за тип (guard в xpLog).
   ============================================================ */
const TRAIN_XP={w:25,m:10,s:5,p:5};
const TRAIN_SK={w:['sk-fit','sk-combat'],m:['sk-fit']};
const TRAIN_NAME={w:'тренировка',m:'мобильность 10 мин',s:'сон 8 ч',p:'белок'};
const TRAIN_LABEL={w:'Тренировки',m:'Мобильность',s:'Сон 8 ч',p:'Белок'};
const MILE_FIELDS=[['pullups','Подтягивания ×'],['pushups','Отжимания ×'],['hang','Вис, с'],['squat','Присед hold, с'],['ankle','Стопа→стена, см'],['fold','Складка, см'],['weight','Вес, кг']];
function trainWeek(){
  const mon=startOfWeekISO(todayISO());
  return [...Array(7)].map((_,i)=>addDays(mon,i));
}
function trainStreak(){
  const has=d=>{const l=(state.train.log[d]||{});return !!(l.w||l.m);};
  const td=todayISO();
  if(!has(td)&&!has(addDays(td,-1)))return 0;
  let s=0,cur=has(td)?td:addDays(td,-1);
  while(has(cur)){s++;cur=addDays(cur,-1);}
  return s;
}
function trainSessionsTotal(){
  let n=0;
  for(const iso in state.train.log)if(state.train.log[iso]&&state.train.log[iso].w)n++;
  return n;
}
function setTrain(iso,k){
  const log=state.train.log[iso]=state.train.log[iso]||{};
  if(!log[k]){
    log[k]=1;
    if(!state.xpLog.some(x=>x.train===k&&x.day===iso&&!x.cancelled)){ // одна награда в день на тип
      addXP(TRAIN_XP[k],'план Боец-190: '+TRAIN_NAME[k],{train:k,day:iso});
      const sk=TRAIN_SK[k]||[];
      if(sk.length)addSkillXP(sk,k==='w'?10:5,'train:'+k);
    }
  }else{
    log[k]=0;
    const e=state.xpLog.find(x=>x.train===k&&x.day===iso&&!x.cancelled);
    if(e){ // вычитаем ровно один раз — за каждую реальную награду (анти-утечка при повторных toggle)
      addXP(-e.amount,'снято: '+TRAIN_NAME[k],{train:k+'_off',day:iso});
      (TRAIN_SK[k]||[]).forEach(sid=>{const s=state.skills.find(x=>x.id===sid);if(s)s.xp=Math.max(0,s.xp-(k==='w'?10:5));});
      e.cancelled=true;
    }
  }
  emitChange();
}
function saveMile(id,f,v){
  state.train.miles[id]=state.train.miles[id]||{};
  state.train.miles[id][f]=v;
  saveState();
}
function weekNo(){
  const st=state.train.start||'2026-11-02';
  return Math.min(12,Math.max(1,Math.floor(daysBetween(st,todayISO())/7)+1));

/* ============================================================
   PHONE/LAN SYNC — pairing with server.py on the laptop (http only)
   Last-write-wins by _savedAt. localStorage stays the offline cache.
   ============================================================ */
var _netPushT=null;
function netOn(){ return location.protocol.indexOf('http')===0; }
function netPush(){
  if(!netOn())return;
  try{
    state._savedAt=Date.now();
    var body=JSON.stringify({data:state});
    fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:body})
      .then(function(r){
        if(r.ok){ try{localStorage.setItem(KEY+'-lastsync',String(Date.now()));}catch(e){} }
        else queueOffline();
      }).catch(function(){ queueOffline(); });
  }catch(e){ queueOffline(); }
}
/* offline write queue: SW Background Sync (IDB) + localStorage fallback + 'online' retry */
function queueOffline(){
  try{
    var q=[]; try{ q=JSON.parse(localStorage.getItem('nexus-sw-queue')||'[]'); }catch(e){}
    q.push({t:Date.now(),data:state}); if(q.length>10)q=q.slice(-10);
    localStorage.setItem('nexus-sw-queue',JSON.stringify(q));
  }catch(e){}
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage({type:'QUEUE',data:JSON.parse(JSON.stringify(state))});
    }
    if(navigator.serviceWorker) navigator.serviceWorker.ready.then(function(reg){
      if(reg.sync) reg.sync.register('nexus-sync').catch(function(){});
    }).catch(function(){});
  }catch(e){}
}
function replayQueue(){
  try{
    var q=[]; try{ q=JSON.parse(localStorage.getItem('nexus-sw-queue')||'[]'); }catch(e){}
    if(!q.length)return;
    var last=q[q.length-1]; // last-write-wins: достаточен один свежий снимок
    fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:last.data})})
      .then(function(r){
        if(r.ok){ localStorage.removeItem('nexus-sw-queue'); try{localStorage.setItem(KEY+'-lastsync',String(Date.now()));}catch(e){} }
      }).catch(function(){});
  }catch(e){}
}

function scheduleNetPush(){ if(!netOn())return; clearTimeout(_netPushT); _netPushT=setTimeout(netPush,1500); }
function unionBy(A,B,better){ // слияние списков по id: элементы обеих сторон, конфликт решает better()
  var out=[],idx={};
  function add(x){
    if(!x||x.id==null)return;
    var id=String(x.id);
    if(idx[id]==null){ idx[id]=out.length; out.push(x); }
    else out[idx[id]]=better(out[idx[id]],x);
  }
  (A||[]).forEach(add); (B||[]).forEach(add);
  return out;
}
function mergeState(loc,srv){ // phone/LAN sync: слияние вместо затирания — задачи/цели/XP не пропадают
  var m=JSON.parse(JSON.stringify((srv._savedAt||0)>=(loc._savedAt||0)?srv:loc));
  var nU=function(a,b){ return ((a.updatedAt||0)>=((b||{}).updatedAt||0))?a:b; };
  m.tasks=unionBy(loc.tasks,srv.tasks,nU);
  m.goals=unionBy(loc.goals,srv.goals,nU);
  m.xpLog=unionBy(loc.xpLog,srv.xpLog,function(a,b){ return (a.cancelled&&!b.cancelled)?a:b; });
  loc.finance=loc.finance||{}; srv.finance=srv.finance||{}; m.finance=m.finance||{};
  m.finance.transactions=unionBy(loc.finance.transactions,srv.finance.transactions,function(a,b){ return a; });
  m.finance.workLog=unionBy(loc.finance.workLog,srv.finance.workLog,function(a,b){ return a; });
  m.skills=unionBy(loc.skills,srv.skills,function(a,b){ return ((a.level||0)*1000+(a.xp||0))>=((b.level||0)*1000+(b.xp||0))?a:b; });
  m.categories=unionBy(loc.categories,srv.categories,function(a,b){ return a; });
  return m;
}
async function netPull(){
  if(!netOn())return false;
  try{
    var r=await fetch('/api/state',{cache:'no-store'}); if(!r.ok)return false;
    var j=await r.json(); var srv=j&&j.data;
    if(!srv||!srv.schemaVersion){ netPush(); return false; } // первый запуск: заливаем локальное состояние на сервер
    var merged=mergeState(state,srv);
    var sig=function(s){ return JSON.stringify([s.tasks,s.goals,s.xpLog,(s.finance||{}).transactions,(s.finance||{}).workLog,s.skills,s.categories,s._savedAt]); };
    if(sig(state)!==sig(merged)){
      state=migrate(merged); _tIdx=null; state.goals.forEach(function(g){delete g._c;});
      saveState(); applySettings(); renderNav(); renderTopbar(); renderView();
      toast('данные синхронизированы');
      return true;
    }
    return false;
  }catch(e){ return false; }
}

<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="google" content="notranslate">
<title>NEXUS // LIFE OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050806'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%2300ff7f'/%3E%3C/svg%3E">
<style>
/* ============================================================
   NEXUS # LIFE OS — design system
   Palette: bg #050806/#0a0f0b · panel #0e1510 · border #1c3a26
   accent #00ff7f · soft #39d98a · dim #7fa38c · amber #ffb300 · err #ff3860
   ============================================================ */
:root{
  --bg0:#050806; --bg1:#0a0f0b; --panel:#0e1510; --panel2:#101a13;
  --border:#1c3a26; --accent:#00ff7f; --soft:#39d98a; --dim:#7fa38c;
  --amber:#ffb300; --err:#ff3860; --text:#cfe8d6;
  --mono:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg0); color:var(--text); font-family:var(--mono);
  font-size:14px; line-height:1.45; overflow-x:hidden;
}
::selection{background:rgba(0,255,127,.25)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg0)}
::-webkit-scrollbar-thumb{background:#1c3a26;border-radius:0}
::-webkit-scrollbar-thumb:hover{background:#2a5c3c}

/* scanline overlay (toggle: body.scan-off) */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  opacity:.16;
}
body.scan-off::before{display:none}
/* glow toggle: body.no-glow kills text-shadows */
body.no-glow .glow, body.no-glow .glow-soft{text-shadow:none!important}
.glow{color:var(--accent);text-shadow:0 0 8px rgba(0,255,127,.55)}
.glow-soft{color:var(--soft);text-shadow:0 0 6px rgba(57,217,138,.4)}
.amber{color:var(--amber)} .err{color:var(--err)}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{
  width:232px;flex:0 0 auto;background:var(--bg1);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#view{padding:18px 20px 40px;max-width:1280px;width:100%;margin:0 auto}

/* ---------- sidebar ---------- */
.brand{
  padding:16px 16px 14px;border-bottom:1px solid var(--border);
  font-size:15px;letter-spacing:.14em;color:var(--accent);
}
.brand span{color:var(--dim);font-size:11px;display:block;letter-spacing:.22em;margin-top:2px}
#nav{flex:1;padding:10px 0;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;
  color:var(--dim);border-left:2px solid transparent;user-select:none;position:relative;
  transition:background .15s,color .15s;
}
.nav-item:hover{color:var(--soft);background:rgba(0,255,127,.04)}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(0,255,127,.07)}
.nav-item svg{flex:0 0 auto;opacity:.9}
.nav-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.nav-badge{
  margin-left:auto;font-size:10px;color:var(--amber);border:1px solid rgba(255,179,0,.4);
  padding:0 5px;min-width:18px;text-align:center;
}
.nav-badge:empty{display:none}
.side-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--dim);letter-spacing:.14em}
/* manual sidebar collapse (body.side-min) */
body.side-min #sidebar{width:58px}
body.side-min .brand{font-size:0;padding:14px 0;text-align:center}
body.side-min .brand span{font-size:8px;letter-spacing:.05em}
body.side-min .nav-label,body.side-min .side-foot{display:none}
body.side-min .nav-item{justify-content:center;padding:11px 0}
body.side-min .nav-badge{position:absolute;transform:translate(12px,-10px);font-size:8px;padding:0 3px}

/* ---------- topbar ---------- */
#topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg1);
  position:sticky;top:0;z-index:50;
}
.tb-date{font-size:12px;letter-spacing:.1em;color:var(--soft);white-space:nowrap}
.tb-rem{font-size:10px;letter-spacing:.12em;color:var(--dim);white-space:nowrap}
.tb-rem b{color:var(--amber);font-weight:400}
.tb-level{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:11px;color:var(--soft)}
.tb-level .lv{color:var(--accent);letter-spacing:.08em}
.bar{height:6px;width:130px;background:#0a120c;border:1px solid var(--border);position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--soft),var(--accent));box-shadow:0 0 8px rgba(0,255,127,.5);transition:width .2s}
.tb-xptxt{font-size:10px;color:var(--dim)}
.btn-ico{padding:5px 9px;line-height:1}

/* ---------- panels ---------- */
.panel{
  background:var(--panel);border:1px solid var(--border);padding:14px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);
  position:relative;
}
.panel-title{
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;
}
.panel-title::before{content:'▸ ';color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1100px){.c3,.c4{grid-column:span 6}.c5,.c6,.c7,.c8{grid-column:span 12}}
@media(max-width:640px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}

.bignum{font-size:34px;line-height:1.1;color:var(--accent)}
.subline{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.06em}

.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px dashed rgba(28,58,38,.6);font-size:12px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--dim)}
.kv .v{color:var(--text);text-align:right}
.kv .v.acc{color:var(--soft)} .kv .v.amb{color:var(--amber)} .kv .v.ern{color:var(--err)}

.ring-txt{fill:var(--accent);font-size:11px;font-family:var(--mono)}
.ring-txt.sm{font-size:8px}
.mini-tag{display:inline-block;font-size:9px;letter-spacing:.14em;border:1px solid var(--border);color:var(--dim);padding:1px 6px;margin-left:6px;vertical-align:middle}
.mini-tag.main{border-color:var(--accent);color:var(--accent)}
.mini-tag.hard{border-color:rgba(255,179,0,.6);color:var(--amber)}
.mini-tag.over{border-color:rgba(255,56,96,.6);color:var(--err)}

/* ---------- buttons / forms ---------- */
.btn{
  background:#0c1410;border:1px solid var(--border);color:var(--soft);
  padding:7px 14px;font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:all .15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px rgba(0,255,127,.22)}
.btn-primary{background:rgba(0,255,127,.1);border-color:var(--accent);color:var(--accent)}
.btn-danger{border-color:rgba(255,56,96,.5);color:var(--err)}
.btn-danger:hover{border-color:var(--err);color:var(--err);box-shadow:0 0 10px rgba(255,56,96,.22)}
.btn.on{border-color:var(--accent);color:var(--accent);background:rgba(0,255,127,.08)}
label.f{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
input.f,select.f,textarea.f{
  width:100%;background:var(--bg1);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;font:inherit;font-size:13px;outline:none;
}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent)}
textarea.f{resize:vertical;min-height:70px}
.frow{margin-bottom:12px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input[type=checkbox].sw{appearance:none;width:34px;height:16px;border:1px solid var(--border);background:var(--bg1);position:relative;cursor:pointer;vertical-align:middle}
input[type=checkbox].sw::after{content:'';position:absolute;left:1px;top:1px;width:12px;height:12px;background:var(--dim);transition:all .15s}
input[type=checkbox].sw:checked{border-color:var(--accent)}
input[type=checkbox].sw:checked::after{left:19px;background:var(--accent);box-shadow:0 0 6px rgba(0,255,127,.6)}
input[type=checkbox].ck{appearance:none;width:13px;height:13px;border:1px solid var(--border);background:var(--bg1);cursor:pointer;flex:0 0 auto;margin-top:2px;position:relative}
input[type=checkbox].ck:checked{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px rgba(0,255,127,.5)}
input[type=checkbox].ck:checked::before{content:'✓';position:absolute;inset:0;color:#050806;font-size:10px;line-height:11px;text-align:center}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(2,6,4,.82);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}
.modal{width:min(580px,94vw);max-height:84vh;overflow-y:auto;animation:pop .15s ease-out;box-shadow:0 0 30px rgba(0,255,127,.12)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal-actions .left{margin-right:auto}
#toast-root{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--panel);border:1px solid var(--accent);color:var(--text);
  padding:10px 14px;font-size:12px;max-width:340px;box-shadow:0 0 16px rgba(0,255,127,.18);
  animation:pop .15s ease-out;
}
.toast.amber{border-color:var(--amber);box-shadow:0 0 16px rgba(255,179,0,.15)}
.toast.out{opacity:0;transition:opacity .2s}
.toast .t-act{color:var(--accent);cursor:pointer;text-decoration:underline;margin-left:8px}

/* ---------- stub screen ---------- */
.stub{padding:36px 20px;text-align:center}
.stub .big{font-size:20px;letter-spacing:.24em;color:var(--dim);margin-bottom:10px}
.stub .big b{color:var(--accent);font-weight:400}
.stage-line{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px;color:var(--dim)}
.stage-line .n{width:26px;color:var(--accent);text-align:right}
.stage-line.done{color:var(--soft)}
.stage-line.done .n::after{content:' ✓';color:var(--accent)}
.stage-line.cur{color:var(--accent)}
.stage-line.lock{opacity:.55}

/* ---------- toolbar / crumbs ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.crumb{font-size:12px;color:var(--dim);letter-spacing:.06em;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.crumb-l{color:var(--soft);cursor:pointer}
.crumb-l:hover{color:var(--accent)}
.crumb-cur{color:var(--accent)}
.crumb .sep{color:var(--border)}
.toolbar .sp{flex:1}

/* ---------- schedule ---------- */
.sch-wrap{overflow-x:auto}
.sch-grid{display:grid;gap:10px;min-width:780px}
.sch-day{background:var(--bg1);border:1px solid var(--border);padding:8px;min-width:140px}
.sch-day.today{border-color:var(--accent);box-shadow:0 0 10px rgba(0,255,127,.12)}
.sch-day-head{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.14em;color:var(--dim);margin-bottom:8px}
.sch-day-head .dnum{color:var(--soft)}
.sch-day-head.today{color:var(--accent)}
.mini-btn{background:none;border:1px solid var(--border);color:var(--dim);font:inherit;font-size:10px;padding:1px 5px;cursor:pointer}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.sch-day-head .mini-btn{margin-left:auto}
.lesson{
  background:rgba(0,255,127,.05);border:1px solid var(--border);border-left:3px solid var(--lc,var(--accent));
  padding:5px 7px;font-size:11px;margin-bottom:6px;position:relative;cursor:pointer;transition:all .15s;
}
.lesson:hover{border-color:var(--lc,var(--accent))}
.lesson .lt{color:var(--dim);font-size:9px;letter-spacing:.05em}
.lesson .ls{color:var(--text)}
.lesson .lte{color:var(--dim);font-size:9px}
.lesson.now{background:rgba(0,255,127,.12);box-shadow:0 0 12px rgba(0,255,127,.28)}
.lesson.past{opacity:.45}
.lesson.cancel{opacity:.55;border-left-color:var(--err)}
.lesson.cancel .ls{text-decoration:line-through}
.lesson .tag{position:absolute;top:3px;right:5px;font-size:8px;letter-spacing:.1em;color:var(--err)}
.lesson.sub{border-left-color:var(--amber)}
.lesson.sub .tag{color:var(--amber)}
.lesson.extra .tag{color:var(--soft)}
.day-note{font-size:10px;color:var(--amber);letter-spacing:.08em;margin-top:2px}

/* ---------- calendar month ---------- */
.cal-grid{display:grid;grid-template-columns:34px repeat(7,1fr);gap:4px;min-width:720px}
.cal-wrap{overflow-x:auto}
.cal-dow{font-size:9px;color:var(--dim);text-align:center;padding:4px 0;letter-spacing:.1em}
.cal-wn{font-size:9px;color:var(--dim);display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);cursor:pointer;min-height:64px}
.cal-wn:hover{color:var(--accent);border-color:var(--accent)}
.cal-cell{min-height:64px;border:1px solid var(--border);background:var(--bg1);padding:4px 5px;font-size:11px;cursor:pointer;position:relative;transition:border-color .15s}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.out{opacity:.3}
.cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 8px rgba(0,255,127,.12)}
.cal-cell .dn{color:var(--soft);font-size:10px}
.cal-cell.today .dn{color:var(--accent)}
.cal-cell .dots{position:absolute;bottom:4px;right:5px;display:flex;gap:3px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.od{background:var(--amber)} .dot.nt{background:var(--soft)} .dot.dl{background:var(--err)}
.cal-cell .cring{position:absolute;bottom:2px;left:2px}
.cal-cell.droptarget{border-color:var(--accent);background:rgba(0,255,127,.08)}

/* ---------- week view ---------- */
.wk-grid{display:grid;gap:10px;min-width:860px}
.wk-wrap{overflow-x:auto}
.wk-col{background:var(--bg1);border:1px solid var(--border);padding:8px;min-width:150px;min-height:200px}
.wk-col.today{border-color:var(--accent)}
.wk-col.droptarget{border-color:var(--accent);background:rgba(0,255,127,.08)}
.wk-head{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;margin-bottom:6px}
.wk-head:hover .wn{color:var(--accent)}
.wk-head .wn{font-size:10px;letter-spacing:.12em;color:var(--dim)}
.wk-head .wp{font-size:10px;color:var(--soft)}
.wk-sec{font-size:9px;letter-spacing:.16em;color:var(--dim);margin:8px 0 4px}

/* ---------- task chips ---------- */
.tchip{
  display:flex;gap:7px;align-items:flex-start;background:var(--bg1);border:1px solid var(--border);
  padding:5px 7px;font-size:11px;margin-bottom:5px;transition:border-color .15s;
}
.tchip[draggable=true]{cursor:grab}
.tchip:hover{border-color:#2a5c3c}
.tchip.done{opacity:.45}
.tchip.done .tt{text-decoration:line-through}
.tchip .tt{color:var(--text);word-break:break-word}
.tchip .p{color:var(--amber);flex:0 0 auto;font-size:10px}
.tchip .g{color:var(--dim);font-size:9px}
.x{cursor:pointer;color:var(--dim);padding:0 3px;flex:0 0 auto}
.x:hover{color:var(--err)}

/* ---------- day timeline ---------- */
.tl{position:relative;margin-left:48px;border-left:1px solid var(--border);height:540px;overflow:hidden}
.tl-hour{position:absolute;left:-48px;width:40px;text-align:right;color:var(--dim);font-size:9px;transform:translateY(-6px)}
.tl-line{position:absolute;left:0;right:0;border-top:1px dashed rgba(28,58,38,.5)}
.tl-block{
  position:absolute;left:4px;right:8px;border:1px solid var(--border);background:rgba(0,255,127,.07);
  border-left:3px solid var(--lc,var(--accent));padding:2px 6px;font-size:10px;overflow:hidden;cursor:pointer;
}
.tl-block .lt{color:var(--dim);font-size:9px}
.tl-block.cancel{opacity:.55;border-left-color:var(--err)}
.tl-block.cancel .ts{text-decoration:line-through}
.tl-block.sub{border-left-color:var(--amber)}
.tl-now{position:absolute;left:0;right:0;height:1px;background:var(--err);box-shadow:0 0 6px var(--err);z-index:5}
.tl-now::before{content:'NOW';position:absolute;right:2px;top:-14px;font-size:8px;color:var(--err);letter-spacing:.1em}

/* ---------- goals ---------- */
.goal-row{border:1px solid var(--border);background:var(--bg1);padding:9px 11px;margin-bottom:8px;transition:border-color .15s}
.goal-row[draggable=true]{cursor:grab}
.goal-row.droptarget{border-color:var(--accent)}
.goal-row.ismain{border-color:rgba(0,255,127,.45);box-shadow:0 0 10px rgba(0,255,127,.07)}
.goal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gdot{width:8px;height:8px;flex:0 0 auto;display:inline-block}
.pbadge{font-size:9px;border:1px solid rgba(255,179,0,.5);color:var(--amber);padding:0 4px;flex:0 0 auto}
.gtitle{cursor:pointer;word-break:break-word;min-width:120px}
.gtitle:hover{color:var(--accent)}
.goal-bar{height:5px;background:#0a120c;border:1px solid var(--border);flex:1;min-width:90px}
.goal-bar>i{display:block;height:100%;transition:width .2s}
.goal-pct{font-size:11px;color:var(--soft);flex:0 0 auto;min-width:40px;text-align:right}
.goal-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--dim);margin-top:5px;align-items:center}
.gactions{margin-left:auto;display:flex;gap:5px;flex:0 0 auto}
.gexpand{border-left:2px solid var(--border);margin-top:9px;padding:8px 0 2px 12px}
.cat-head{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
.cat-head .cn{font-size:12px;letter-spacing:.18em;color:var(--soft);text-transform:uppercase}
.cat-head .cn::before{content:'// ';color:var(--border)}
.swatch{width:16px;height:16px;display:inline-block;border:1px solid var(--border);cursor:pointer;margin-right:5px;vertical-align:middle}
.swatch.sel{outline:1px solid var(--accent);outline-offset:1px}
.fm-preview{font-size:11px;margin-top:6px;min-height:16px}
.gstat{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--dim);margin:8px 0}

/* ---------- analytics ---------- */
.hm{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.hm-col{display:flex;flex-direction:column;gap:3px}
.hm-c{width:12px;height:12px;background:#0a120c;border:1px solid rgba(28,58,38,.5);flex:0 0 auto}
.hm-c.h1{background:#1c3a26}
.hm-c.h2{background:#2ea86b}
.hm-c.h3{background:#39d98a}
.hm-c.h4{background:#00ff7f;box-shadow:0 0 4px rgba(0,255,127,.5)}
.chart-wrap{overflow-x:auto}
.ins-line{font-size:12px;color:var(--text);padding:4px 0;border-bottom:1px dashed rgba(28,58,38,.6)}
.ins-line:last-child{border-bottom:none}
.ins-line::before{content:'▸ ';color:var(--accent)}

/* ---------- finance ---------- */
.fin-amt-in{color:var(--accent)} .fin-amt-out{color:var(--err)}
.fin-row{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed rgba(28,58,38,.6);font-size:12px;flex-wrap:wrap}
.fin-row:last-child{border-bottom:none}
.fin-row .fd{color:var(--dim);flex:0 0 84px}
.fin-row .fn{flex:1;min-width:120px}
.fin-row .fa{flex:0 0 auto;font-size:13px}
.budget-line{margin-bottom:10px}

/* ---------- life balance / watchlist ---------- */
.media-board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.media-board{grid-template-columns:1fr}}
.media-col{background:var(--bg1);border:1px solid var(--border);padding:10px;min-height:140px}
.media-card{border:1px solid var(--border);background:var(--panel);padding:7px 9px;margin-bottom:7px;font-size:11px}

.arcane-whisper{position:fixed;z-index:0;pointer-events:none;color:rgba(160,107,255,.32);text-shadow:0 0 10px rgba(0,212,255,.22);animation:whisper-rise 8.5s ease-out forwards}
@keyframes whisper-rise{0%{opacity:0;transform:translateY(24px) rotate(-8deg)}14%{opacity:.4}100%{opacity:0;transform:translateY(-150px) rotate(7deg)}}
@media (prefers-reduced-motion:reduce){.arcane-whisper{display:none}.lvup-box::after{animation:none}}
/* ── PHONE (≤700px): off-canvas sidebar, stacked columns, touch sizing ── */
/* backdrop живёт ВНУТРИ #app (stacking context z1) и виден только при открытом меню —
   иначе навсегда перекрывает экран (баг «телефон не переходит по меню») */
#side-backdrop{position:fixed;inset:0;background:rgba(4,2,10,.55);z-index:170;display:none}
body.side-open #side-backdrop{display:block}
@media (max-width:700px){
  #sidebar{position:fixed;left:-270px;top:0;bottom:0;width:264px;z-index:180;transition:left .25s ease;
    box-shadow:10px 0 40px rgba(0,0,0,.6);display:flex;flex-direction:column}
  body.side-open #sidebar{left:0}
  #main{width:100%;min-width:0}
  #topbar{gap:8px;padding:8px 10px}
  .tb-rem{display:none}
  .tb-date{font-size:11px}
  .btn{padding:9px 14px;font-size:13px}
  .grid{gap:10px}
  .panel{padding:12px}
  .toolbar{gap:6px}
  .sch-grid{grid-template-columns:1fr!important;min-width:0!important}
  .sch-day{min-width:0}
  .tr-day{gap:6px;padding:8px 4px}
  .tr-ck{margin-right:8px;white-space:normal}
  .frow2{flex-direction:column}
  #view{padding-bottom:24px}
  #app{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  /* bottom navigation */
  #bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:160;display:flex;
    background:linear-gradient(180deg,rgba(16,15,30,.98),rgba(8,7,15,.99));border-top:1px solid #2a1d4a;
    padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
  .bn-btn{flex:1;background:none;border:none;color:var(--dim);font:inherit;font-size:10px;
    font-variant:small-caps;letter-spacing:.12em;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;min-height:44px}
  .bn-btn .bn-i{font-size:18px;font-style:normal}
  .bn-btn:hover,.bn-btn:focus{color:var(--parch)}
  .bn-btn.active{color:var(--accent);text-shadow:0 0 10px rgba(160,107,255,.6)}
  #more-drawer{position:fixed;inset:0;z-index:190;background:linear-gradient(180deg,#0d0c1a,#0a0a0f);
    display:none;flex-direction:column;padding:16px;overflow-y:auto}
  body.more-open #more-drawer{display:flex}
  .md-head{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;font-family:'Cinzel',Georgia,serif;font-size:16px}
  .md-head span{color:var(--dim);font-size:11px;letter-spacing:.2em;font-family:'Segoe UI',sans-serif}
  .md-head button{margin-left:auto}
  .md-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;
    color:var(--parch);font:inherit;font-size:14px;padding:13px 10px;border-bottom:1px solid rgba(160,107,255,.14);cursor:pointer}
  .md-item:hover,.md-item:focus{background:rgba(160,107,255,.1)}
  .sw-update{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:400;
    display:flex;gap:12px;align-items:center;background:rgba(5,10,7,.97);border:1px solid #00ff7f;color:#b8ffd9;
    padding:10px 12px;font-size:12px;letter-spacing:.08em;box-shadow:0 0 18px rgba(0,255,127,.35)}
  .sw-update span{font-variant:small-caps;letter-spacing:.16em}
}
@media (min-width:701px){ #more-drawer{display:none!important} }

  const dt=new Date(d.getFullYear(),d.getMonth(),d.getDate());

  const ft=new Date(dt.getFullYear(),0,4); const fd=(ft.getDay()+6)%7; ft.setDate(ft.getDate()-fd+3);

function levelFromXP(total){
  let lvl=1,rem=total;
  while(rem>=xpForLevel(lvl)&&lvl<999){rem-=xpForLevel(lvl);lvl++;}
  return {level:lvl,into:rem,need:xpForLevel(lvl)};
}
const RANKS=[[1,'E'],[5,'D'],[10,'C'],[15,'B'],[20,'A'],[30,'S'],[40,'NATIONAL']];

function globalStreak(){ // consecutive days (ending today/yesterday) with ≥1 task completed
  const ds=[...new Set(state.tasks.filter(x=>x.done&&x.doneAt).map(x=>x.doneAt))].sort().reverse();
  if(!ds.length)return 0;
  const td=todayISO();
  if(ds[0]!==td&&ds[0]!==addDays(td,-1))return 0;
  let s=1,cur=ds[0];
  for(let i=1;i<ds.length;i++){ if(daysBetween(ds[i],cur)===1){s++;cur=ds[i];} else break; }
  return s;
}
function longestStreak(){
  const ds=[...new Set(state.tasks.filter(x=>x.done&&x.doneAt).map(x=>x.doneAt))].sort();
  let best=0,run=0,prev=null;
  for(const d of ds){ run=(prev&&daysBetween(prev,d)===1)?run+1:1; if(run>best)best=run; prev=d; }
  return best;
}

/* ============================================================
   SECTION 5 — FORMULA ENGINE (safe parser, no eval / no Function)
   Variables: done target sum avg count streak(streakDays)
              daysLeft percent income week monthProgress
   ============================================================ */
const FORMULA_VARS=['done','target','sum','avg','count','streak','streakDays','daysLeft','percent','income','week','monthProgress'];
function evalFormula(src,ctx){
  const s=String(src||''); let i=0;
  function ws(){while(i<s.length&&/\s/.test(s[i]))i++;}
  function err(m){throw new Error(m+' @ pos '+(i+1));}
  function num(){const st=i;while(i<s.length&&/[\d.]/.test(s[i]))i++;if(st===i)err('number expected');const v=parseFloat(s.slice(st,i));if(isNaN(v))err('bad number');return v;}
  function primary(){
    ws();
    if(s[i]==='('){i++;const v=ternary();ws();if(s[i]!==')')err('")" expected');i++;return v;}
    if(/[\d.]/.test(s[i]||''))return num();
    if(/[A-Za-z_]/.test(s[i]||'')){
      const name=(()=>{const st=i;while(i<s.length&&/[A-Za-z_0-9]/.test(s[i]))i++;return s.slice(st,i);})();
      const key=name==='streakDays'?'streak':name;
      if(!(key in ctx))err('unknown variable: '+name);
      if(typeof ctx[key]!=='number'||isNaN(ctx[key]))err('variable '+name+' is not a number');
      return ctx[key];
    }
    err('unexpected "'+(s[i]||'end of formula')+'"');
  }
  function unary(){ws();if(s[i]==='-'){i++;return -unary();}return primary();}
  function mul(){let v=unary();for(;;){ws();const c=s[i];
    if(c==='*'){i++;v*=unary();}
    else if(c==='/'){i++;const d=unary();if(d===0)err('division by zero');v/=d;}
    else if(c==='%'){i++;const d=unary();if(d===0)err('modulo by zero');v%=d;}
    else return v;}}
  function add(){let v=mul();for(;;){ws();const c=s[i];
    if(c==='+'){i++;v+=mul();}
    else if(c==='-'){i++;v-=mul();}
    else return v;}}
  function cmp(){let v=add();for(;;){ws();let op=null;
    if(s.startsWith('>=',i))op='>='; else if(s.startsWith('<=',i))op='<='; else if(s.startsWith('==',i))op='==';
    else if(s.startsWith('!=',i))op='!='; else if(s.startsWith('<>',i))op='!='; else if(s.startsWith('&&',i))op='&&';
    else if(s.startsWith('||',i))op='||'; else if(s[i]==='>')op='>'; else if(s[i]==='<')op='<';
    else if(s[i]==='=')op='==';
    if(!op)return v; i+=op.length; const r=add();
    if(op==='&&')v=(v&&r)?1:0; else if(op==='||')v=(v||r)?1:0;
    else v=(op==='>='?v>=r:op==='<='?v<=r:op==='=='?v===r:op==='!='?v!==r:op==='>'?v>r:v<r)?1:0;}}
  function ternary(){const c=cmp();ws();
    if(s[i]==='?'){i++;const a=ternary();ws();if(s[i]!==':')err('":" expected in ternary');i++;const b=ternary();return c?a:b;}
    return c;}
  try{ const v=ternary(); ws(); if(i<s.length)err('unexpected "'+s.slice(i,i+5)+'"'); return {ok:true,value:v}; }
  catch(e){ return {ok:false,error:e.message}; }
}

/* ---------- goal progress + re-plan ---------- */
function goalVars(g){
  const tks=state.tasks.filter(x=>x.goalId===g.id);
  const doneT=tks.filter(x=>x.done);
  const vals=doneT.filter(x=>x.value!=null).map(x=>x.value);
  const sum=vals.reduce((a,b)=>a+b,0);
  const td=todayISO();
  const ds=[...new Set(doneT.map(x=>x.doneAt).filter(Boolean))].sort().reverse();
  let streak=0;
  if(ds.length&&(ds[0]===td||ds[0]===addDays(td,-1))){
    streak=1; let cur=ds[0];
    for(let k=1;k<ds.length;k++){ if(daysBetween(ds[k],cur)===1){streak++;cur=ds[k];} else break; }
  }
  const ce=state.settings.campaignEnd||'2026-11-30';
  const income=state.finance.transactions.filter(x=>x.type==='income'&&x.date.startsWith(ce.slice(0,7))).reduce((a,x)=>a+x.amount,0);
  const n=new Date();
  const monthProgress=Math.round(n.getDate()/daysInMonth(n.getFullYear(),n.getMonth()+1)*1000)/10;
  return {
    done:doneT.length, target:g.target||1, count:vals.length, sum,
    avg:vals.length?sum/vals.length:0, streak, streakDays:streak,
    daysLeft:g.deadline?daysBetween(td,g.deadline):0,
    percent:g.lastPercent||0, income,
    week:isoWeek(n), monthProgress,
  };
}
function goalPercent(g){
  if(g._c&&g._c.rev===_REV)return g._c.r; // per-revision cache: goals are evaluated many times per render
  const ctx=goalVars(g);
  const r=evalFormula(g.formula,ctx);
  let pct=0;
  if(r.ok){ pct=r.value===true?100:r.value===false?0:r.value; pct=Math.max(0,Math.min(100,Math.round(pct*10)/10)); }
  if(g.doneManual)pct=100; // ручная отметка «выполнена» перекрывает формулу
  const was=g.lastPercent||0;
  g.lastPercent=pct; g._lastEval=r;
  if(pct>=100&&was<100&&!g._awarded){
    g._awarded=true;
    let amt=g.xp||150;
    const early=g.bonusEarly&&g.deadline&&todayISO()<=g.deadline;
    if(early)amt+=g.bonusEarly;
    g.history.push({date:todayISO(),text:'COMPLETED · +'+amt+' XP'+(early?' (early bonus)':'')});
    addXP(amt,'цель: '+g.title,{goalId:g.id});
    saveState();
  }
  const res={pct,ctx,r};
  g._c={rev:_REV,r:res};
  return res;
}
function behindSchedule(g){
  if(!g.deadline||g.type==='one')return null;
  const td=todayISO();
  const total=Math.max(1,daysBetween(g.createdAt,g.deadline));
  const elapsed=Math.max(0,Math.min(total,daysBetween(g.createdAt,td)));
  const expected=elapsed/total*100;
  const {pct,ctx}=goalPercent(g);
  const perDay=g.deadline>td?Math.max(0,(g.target||1)-ctx.done)/Math.max(1,daysBetween(td,g.deadline)):null;
  return pct<expected-12?{expected:Math.round(expected),pct,perDay}:null;
}

function svgLineChart(series,w,h,opt={}){
  const max=opt.max??100, min=opt.min??0;
  const padL=30,padB=16,padT=10,padR=8;
  const iw=w-padL-padR, ih=h-padT-padB;
  const n=series.length||1;
  const X=i=>padL+(n<=1?iw/2:i*iw/(n-1));
  const Y=v=>padT+ih-(Math.max(min,Math.min(max,v))-min)/(max-min)*ih;
  let grid='',dots='',labels='';
  if(!opt.mini){
    [0,25,50,75,100].forEach(p=>{
      const v=min+(max-min)*p/100;
      if(v>=min&&v<=max) grid+='<line x1="'+padL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(w-padR)+'" y2="'+Y(v).toFixed(1)+'" stroke="#1c3a26" stroke-width="1" stroke-dasharray="2 3"/>'+
        '<text x="'+(padL-4)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="#7fa38c">'+Math.round(v)+'</text>';
    });
  }
  let path='';
  series.forEach((p,i)=>{
    if(p.y==null)return;
    path+=(path?' L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);
    if(opt.mini)return;
    const tip=p.t!=null?p.t:(Math.round(p.y*10)/10+'%');
    dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2" fill="#00ff7f"><title>'+esc(p.x+' · '+tip)+'</title></circle>';
  });
  if(!opt.mini){
    const step=Math.max(1,Math.ceil(n/8));
    series.forEach((p,i)=>{ if(i%step===0) labels+='<text x="'+X(i).toFixed(1)+'" y="'+(h-4)+'" text-anchor="middle" font-size="8" fill="#7fa38c">'+esc(p.x)+'</text>'; });
  }
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:'+w+'px;height:auto'+(opt.mini?';display:block':'')+'">'+grid+
    '<path d="'+path+'" fill="none" stroke="#00ff7f" stroke-width="'+(opt.mini?1.2:1.5)+'" style="filter:drop-shadow(0 0 3px rgba(0,255,127,.5))"/>'+dots+labels+'</svg>';
}
function svgBarChart(items,w,h,opt={}){
  const max=opt.max??100;
  const padL=30,padB=16,padT=12,padR=8;
  const iw=w-padL-padR, ih=h-padT-padB;
  const n=items.length||1, bw=Math.min(42,iw/n*0.62);
  let out='';
  [0.25,0.5,0.75,1].forEach(p=>{
    const y=padT+ih-ih*p;
    out+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="#1c3a26" stroke-width="1" stroke-dasharray="2 3"/>'+
      '<text x="'+(padL-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="#7fa38c">'+Math.round(max*p)+'</text>';
  });
  items.forEach((it,i)=>{
    const x=padL+i*iw/n+(iw/n-bw)/2;
    const v=Math.max(0,Math.min(max,it.val??0));

      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="8" fill="#7fa38c">'+(it.val==null?'—':Math.round(it.val))+'</text>'+
      '<text x="'+(padL+i*iw/n+iw/n/2).toFixed(1)+'" y="'+(h-4)+'" text-anchor="middle" font-size="8" fill="#7fa38c">'+esc(it.label)+'</text>';
  });

function svgGroupedBars(items,w,h,opt={}){ // items: [{label, a, b}] — pairs
  const max=opt.max??100;
  const padL=30,padB=16,padT=12,padR=8;

    out+'</svg>';
}
function svgDonut(items,size=140){

let _tIdx=null;
function taskIndex(){ // date → sorted tasks; rebuilt once per data revision
  if(_tIdx&&_tIdx.rev===_REV)return _tIdx;
  const m={};
  for(const x of state.tasks){ (m[x.date]=m[x.date]||[]).push(x); }
  for(const k in m){ m[k].sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(b.priority-a.priority)); }
  _tIdx={rev:_REV,m};
  return _tIdx;
}
function taskCounts(){
  const td=todayISO(), ws=startOfWeekISO(td), we=endOfWeekISO(td);
  const open=state.tasks.filter(x=>!x.done);
  return {
    today:open.filter(x=>x.date<=td).length,
    week:open.filter(x=>x.date>=ws&&x.date<=we).length,
    total:open.length,
  };
}
function rangeProgress(from,to){
  const inR=state.tasks.filter(x=>x.date>=from&&x.date<=to);
  if(!inR.length)return null;
  return Math.round(inR.filter(x=>x.done).length/inR.length*100);
}
function dayTasks(iso){ return taskIndex().m[iso]||[]; }
const byPrioDate=(a,b)=>b.priority-a.priority||(a.date<b.date?-1:a.date>b.date?1:0);
function toggleTask(id){
  const tk=state.tasks.find(x=>x.id===id); if(!tk)return;
  tk.done=!tk.done;
  tk.updatedAt=Date.now();
  if(tk.done){
    tk.doneAt=todayISO();
    const xp=Math.round(50*(PRIORITY_MULT[tk.priority]||1)*streakMult(globalStreak()));
    tk.xpAwarded=xp;
    addXP(xp,'задача: '+tk.title,{taskId:tk.id});
    const g=tk.goalId?state.goals.find(g=>g.id===tk.goalId):null;
    if(g&&g.skills) addSkillXP(g.skills,20,'task');
  }else{
    tk.doneAt=null;
    if(tk.xpAwarded){ addXP(-tk.xpAwarded,'задача снята: '+tk.title,{taskId:tk.id}); tk.xpAwarded=null; }
  }
  emitChange();
}
function delTask(id){
  const i=state.tasks.findIndex(x=>x.id===id); if(i<0)return;
  const [tk]=state.tasks.splice(i,1);
  toast('Task deleted',{amber:true,action:()=>{state.tasks.splice(i,0,tk);emitChange();}});
  emitChange();
}

  const tk=state.tasks.find(x=>x.id===id); if(!tk)return;

const LESSON_COLORS=['#00ff7f','#39d98a','#2ea86b','#7fa38c','#9fd8b0','#ffb300'];
function lessonColor(l){ return l.color||LESSON_COLORS[[...l.subject].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,0)%LESSON_COLORS.length]; }
function lessonsForDate(iso){
  const d=fromISO(iso); let wd=d.getDay(); wd=wd===0?7:wd;
  const base=state.schedule.template.filter(l=>l.day===wd).map(l=>({...l,status:'ok',refId:l.id}));
  for(const o of (state.schedule.overrides[iso]||[])){
    if(o.kind==='cancel'){ const b=base.find(x=>x.refId===o.lessonId); if(b)b.status='cancel'; }
    else if(o.kind==='sub'){ const b=base.find(x=>x.refId===o.lessonId); if(b)b.status='cancel'; base.push({...o.lesson,status:'sub',refId:null,_ovId:o.id}); }
    else if(o.kind==='extra'){ base.push({...o.lesson,status:'extra',refId:null,_ovId:o.id}); }
  }
  return base.sort((a,b)=>a.start<b.start?-1:1);
}
function nextLessonInfo(){
  const now=new Date(), cur=now.getHours()*60+now.getMinutes(), td=todayISO();
  const today=lessonsForDate(td).filter(l=>l.status!=='cancel');
  for(const l of today){ const s=minsOf(l.start),e=minsOf(l.end); if(cur>=s&&cur<e) return {type:'now',l,mins:e-cur}; }
  for(const l of today){ if(minsOf(l.start)>cur) return {type:'next',l,mins:minsOf(l.start)-cur}; }
  for(let i=1;i<=7;i++){
    const iso=addDays(td,i);
    const ls=lessonsForDate(iso).filter(l=>l.status!=='cancel');
    if(ls.length) return {type:'future',l:ls[0],iso,days:i};
  }
  return null;
}
function lessonTagTxt(l){ return l.status==='cancel'?t('l_cancelled'):l.status==='sub'?t('l_sub'):l.status==='extra'?t('l_extra'):''; }
function lessonBlock(l,iso,nowMin){
  const col=lessonColor(l);
  const st=minsOf(l.start),en=minsOf(l.end);
  const isNow=nowMin!=null&&nowMin>=st&&nowMin<en&&l.status!=='cancel';
  const isPast=nowMin!=null&&nowMin>=en&&l.status!=='cancel';
  const tag=lessonTagTxt(l);
  return '<div class="lesson '+(l.status||'')+(isNow?' now':'')+(isPast?' past':'')+'" style="--lc:'+col+'" onclick="lessonDayMenu(\''+iso+'\',\''+(l.refId||'')+'\',\''+(l._ovId||'')+'\')">'+
    '<div class="lt">'+l.start+' – '+l.end+(l.room?' · '+esc(l.room):'')+(tag?' <span class="tag">'+tag+'</span>':'')+markBadge(iso,l)+'</div>'+
    '<div class="ls">'+esc(l.subject)+'</div>'+
    (l.teacher?'<div class="lte">'+esc(l.teacher)+'</div>':'')+
  '</div>';
}

/* ============================================================
   SECTION 12 — CALENDAR (Year > Month > Week > Day)
   ============================================================ */
let cal=(function(){const n=new Date();return{mode:'month',y:n.getFullYear(),m:n.getMonth()+1,d:null};})();
function calMode(mode){
  cal.mode=mode;
  if(mode==='day'&&!cal.d){ cal.d=todayISO(); const n=new Date(); cal.y=n.getFullYear(); cal.m=n.getMonth()+1; }
  renderView();
}
function calToday(){ const n=new Date(); cal={mode:'day',y:n.getFullYear(),m:n.getMonth()+1,d:todayISO()}; renderView(); }
function calShift(dir){
  const n=new Date();
  if(cal.mode==='year'){ cal.y=(cal.y??n.getFullYear())+dir; }
  else if(cal.mode==='month'){
    let y=cal.y??n.getFullYear(), m=(cal.m??n.getMonth()+1)+dir;
    if(m<1){m=12;y--;} if(m>12){m=1;y++;}
    cal.y=y;cal.m=m;cal.d=null;
  }
  else if(cal.mode==='week'){ cal.d=addDays(cal.d||todayISO(),dir*7); }
  else { cal.d=addDays(cal.d||todayISO(),dir); }
  renderView();
}
function crumbHTML(){
  const n=new Date();
  const y=cal.y??n.getFullYear(), m=cal.m??n.getMonth()+1;
  const a=cal.d||toISO(new Date(y,m-1,1));
  const wk=startOfWeekISO(a);
  const parts=[
    {mode:'year', on:cal.mode!=='year',  label:t('cal_year')+' '+y},
    {mode:'month',on:cal.mode!=='month', label:t('mo')[m-1]+' '+y},
    {mode:'week', on:cal.mode!=='week',  label:'W'+isoWeek(fromISO(wk))+' · '+fmtShort(wk)},
    {mode:'day',  on:cal.mode!=='day',   label:fmtShort(a)},
  ];
  return '<span class="crumb">'+parts.map(p=>p.on?'<span class="crumb-l" onclick="calMode(\''+p.mode+'\')">'+p.label+'</span>':'<span class="crumb-cur">'+p.label+'</span>').join('<span class="sep">▸</span>')+'</span>';
}
function monthStats(y,m){
  const from=toISO(new Date(y,m-1,1)), to=toISO(new Date(y,m-1,daysInMonth(y,m)));
  const inM=state.tasks.filter(x=>x.date>=from&&x.date<=to);
  return {total:inM.length,done:inM.filter(x=>x.done).length};
}
function renderCalYear(){
  const y=cal.y??new Date().getFullYear();
  const cells=[];
  for(let m=1;m<=12;m++){
    const st=monthStats(y,m);
    const pct=st.total?Math.round(st.done/st.total*100):null;
    const dlN=state.goals.filter(g=>g.deadline&&g.deadline.startsWith(y+'-'+pad2(m))).length;
    cells.push('<div class="c3 panel" style="cursor:pointer" onclick="cal.y='+y+';cal.m='+m+';calMode(\'month\')">'+
      '<div class="panel-title">'+t('mo')[m-1]+'</div>'+
      '<div style="display:flex;align-items:center;gap:10px">'+svgRing(pct,44)+
      '<div class="subline">'+st.done+'/'+st.total+' задач'+(dlN?'<br>'+dlN+' дедлайнов':'')+'</div></div>'+
    '</div>');
  }
  return '<div class="toolbar"><span class="crumb"><span class="crumb-cur">'+t('cal_year')+' '+y+'</span></span><span class="sp"></span>'+
      '<button class="btn" onclick="calShift(-1)">◂</button><button class="btn" onclick="calToday()">'+t('cal_today')+'</button><button class="btn" onclick="calShift(1)">▸</button></div>'+
    '<div class="grid">'+cells.join('')+'</div>';
}
function cellTooltip(iso){
  const tks=dayTasks(iso);
  const dls=state.goals.filter(g=>g.deadline===iso);
  const lines=tks.slice(0,5).map(x=>(x.done?'[✓] ':'[ ] ')+x.title);
  dls.slice(0,3).forEach(g=>lines.push('◈ deadline: '+g.title));
  if(tks.length>5)lines.push('… +'+(tks.length-5)+' more');
  return esc(lines.join('\n'));
}
function renderCalMonth(){
  const n=new Date();
  const y=cal.y??n.getFullYear(), m=cal.m??n.getMonth()+1;
  const td=todayISO();
  const ws=startOfWeekISO(toISO(new Date(y,m-1,1)));
  const wsn=state.settings.weekStart==='sun'?0:1;
  let html='<div class="toolbar">'+crumbHTML()+'<span class="sp"></span>'+
    '<button class="btn" onclick="calShift(-1)">◂</button><button class="btn" onclick="calToday()">'+t('cal_today')+'</button><button class="btn" onclick="calShift(1)">▸</button></div>';
  const dows=[0,1,2,3,4,5,6].map(i=>(i+wsn)%7).map(i=>'<div class="cal-dow">'+t('wd')[i]+'</div>').join('');
  html+='<div class="cal-wrap"><div class="cal-grid"><div class="cal-dow">W#</div>'+dows;
  let cur=ws, guard=0;
  while(guard++<60){
    html+='<div class="cal-wn" onclick="cal.d=\''+cur+'\';calMode(\'week\')">W'+isoWeek(fromISO(cur))+'</div>';
    for(let i=0;i<7;i++){
      const iso=cur;
      const d=fromISO(iso);
      const inM=d.getMonth()+1===m;
      const tks=dayTasks(iso);
      const done=tks.filter(x=>x.done).length;
      const pct=tks.length?Math.round(done/tks.length*100):null;
      const overdue=tks.filter(x=>!x.done&&iso<td).length;
      const hasNote=!!state.calendarNotes[iso];
      const hasDl=state.goals.some(g=>g.deadline===iso&&!state.tasks.some(x=>x.goalId===g.id&&x.done));
      let dots='';
      if(overdue)dots+='<span class="dot od"></span>';
      if(hasDl)dots+='<span class="dot dl"></span>';
      if(hasNote)dots+='<span class="dot nt"></span>';
      html+='<div class="cal-cell'+(inM?'':' out')+(iso===td?' today':'')+'" title="'+cellTooltip(iso)+'" '+
        'onclick="cal.d=\''+iso+'\';cal.y='+d.getFullYear()+';cal.m='+(d.getMonth()+1)+';calMode(\'day\')" '+
        'ondragover="event.preventDefault();this.classList.add(\'droptarget\')" ondragleave="this.classList.remove(\'droptarget\')" ondrop="dropTask(event,\''+iso+'\')">'+
        '<div class="dn">'+pad2(d.getDate())+'</div>'+
        (tks.length?'<div class="cring">'+svgRing(pct,26,3)+'</div>':'')+
        '<div class="dots">'+dots+'</div>'+
      '</div>';
      cur=addDays(cur,1);
    }
    if(fromISO(addDays(cur,-1)).getMonth()+1===m&&fromISO(cur).getMonth()+1!==m) break; // month fully covered
  }
  html+='</div></div>';
  return html;
}
function renderCalWeek(){
  const td=todayISO();
  const ws=startOfWeekISO(cal.d||td);
  let html='<div class="toolbar">'+crumbHTML()+'<span class="sp"></span>'+
    '<button class="btn" onclick="calShift(-1)">◂</button><button class="btn" onclick="calToday()">'+t('cal_today')+'</button><button class="btn" onclick="calShift(1)">▸</button></div>';
  const cols=[];
  for(let i=0;i<7;i++){
    const iso=addDays(ws,i);
    const d=fromISO(iso);
    const tks=dayTasks(iso);
    const done=tks.filter(x=>x.done).length;
    const pct=tks.length?Math.round(done/tks.length*100):null;
    const ls=lessonsForDate(iso);
    const dls=state.goals.filter(g=>g.deadline===iso);
    cols.push('<div class="wk-col'+(iso===td?' today':'')+'" ondragover="event.preventDefault();this.classList.add(\'droptarget\')" ondragleave="this.classList.remove(\'droptarget\')" ondrop="dropTask(event,\''+iso+'\')">'+
      '<div class="wk-head" onclick="cal.d=\''+iso+'\';calMode(\'day\')"><span class="wn">'+t('wd')[d.getDay()]+' '+pad2(d.getDate())+'</span><span class="wp">'+(pct==null?'—':pct+'%')+'</span></div>'+
      (ls.length?'<div class="wk-sec">'+t('cal_lessons')+'</div>'+ls.map(l=>{
        const cls=l.status==='cancel'?'cancel':l.status==='sub'?'sub':l.status==='extra'?'extra':'';
        return '<div class="lesson '+cls+'" style="--lc:'+lessonColor(l)+'" onclick="lessonDayMenu(\''+iso+'\',\''+(l.refId||'')+'\',\''+(l._ovId||'')+'\')">'+
          '<div class="lt">'+l.start+'–'+l.end+(lessonTagTxt(l)?' <span class="tag">'+lessonTagTxt(l)+'</span>':'')+markBadge(iso,l)+'</div>'+
          '<div class="ls">'+esc(l.subject)+'</div></div>';
      }).join(''):'')+
      (dls.length?'<div class="wk-sec">'+t('cal_deadlines')+'</div>'+dls.map(g=>'<div class="subline err">◈ '+esc(g.title.slice(0,30))+'</div>').join(''):'')+
      '<div class="wk-sec">'+t('cal_tasks')+(tks.length?' · '+done+'/'+tks.length:'')+'</div>'+
      (tks.length?tks.map(x=>taskChip(x,{del:true})).join(''):'<div class="subline">'+t('cal_no_tasks')+'</div>')+
    '</div>');
  }
  return html+'<div class="wk-wrap"><div class="wk-grid" style="grid-template-columns:repeat(7,1fr)">'+cols.join('')+'</div></div>';
}
function renderCalDay(){
  const iso=cal.d||todayISO();
  const td=todayISO();
  const ls=lessonsForDate(iso);
  const tks=dayTasks(iso);
  const done=tks.filter(x=>x.done).length;
  const pct=tks.length?Math.round(done/tks.length*100):null;
  const dls=state.goals.filter(g=>g.deadline===iso);
  const START=6*60,ROWH=30;
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  let tl='';
  for(let h=6;h<24;h++){
    tl+='<div class="tl-hour" style="top:'+((h*60-START)/60*ROWH)+'px">'+pad2(h)+':00</div>'+
        '<div class="tl-line" style="top:'+((h*60-START)/60*ROWH)+'px"></div>';
  }
  let blocks='';
  for(const l of ls){
    const st=minsOf(l.start),en=minsOf(l.end);
    const top=(st-START)/60*ROWH, hh=Math.max(18,(en-st)/60*ROWH-2);
    const cls=l.status==='cancel'?'cancel':l.status==='sub'?'sub':l.status==='extra'?'extra':'';
    const tag=lessonTagTxt(l);
    blocks+='<div class="tl-block '+cls+'" style="top:'+top+'px;height:'+hh+'px;--lc:'+lessonColor(l)+'" onclick="lessonDayMenu(\''+iso+'\',\''+(l.refId||'')+'\',\''+(l._ovId||'')+'\')">'+
      '<span class="lt">'+l.start+'–'+l.end+(tag?' · '+tag:'')+'</span> <span class="ts">'+esc(l.subject)+'</span></div>';
  }
  const nowLine=iso===td&&nowMin>=START?'<div class="tl-now" style="top:'+((nowMin-START)/60*ROWH)+'px"></div>':'';
  const note=state.calendarNotes[iso]||'';
  return '<div class="toolbar">'+crumbHTML()+'<span class="crumb" id="tl-count"></span><span class="sp"></span>'+
    '<button class="btn" onclick="calShift(-1)">◂</button><button class="btn" onclick="calToday()">'+t('cal_today')+'</button><button class="btn" onclick="calShift(1)">▸</button></div>'+
    '<div class="grid">'+
      '<div class="c7 panel"><div class="panel-title">'+fmtDate(iso)+' · '+t('cal_lessons')+'</div>'+
        '<div class="tl">'+tl+blocks+nowLine+'</div>'+
        '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+
          '<button class="btn" onclick="extraLessonModal(\''+iso+'\',\'extra\')">'+t('l_extra')+'</button>'+
          '<button class="btn" onclick="extraLessonModal(\''+iso+'\',\'sub\')">'+t('l_sub')+'</button>'+
        '</div></div>'+
      '<div class="c5 panel"><div class="panel-title">'+t('cal_tasks')+' · '+t('cal_progress')+'</div>'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+svgRing(pct,44)+'<span class="subline">'+done+' / '+tks.length+'</span></div>'+
        (tks.length?tks.map(x=>taskChip(x,{del:true})).join(''):'<div class="subline">'+t('cal_no_tasks')+'</div>')+
        '<div style="margin:10px 0"><button class="btn" onclick="quickAdd(\''+iso+'\')">'+t('cal_addtask')+'</button></div>'+
        (dls.length?'<div class="wk-sec">'+t('cal_deadlines')+'</div>'+dls.map(g=>'<div class="subline err">◈ '+esc(g.title)+'</div>').join(''):'')+
        '<div class="wk-sec">'+t('cal_notes')+'</div>'+
        '<textarea class="f" onchange="saveNote(\''+iso+'\',this.value)" placeholder="'+t('cal_note_ph')+'">'+esc(note)+'</textarea>'+
      '</div>'+
    '</div>';
}
function saveNote(iso,v){
  if(v.trim())state.calendarNotes[iso]=v; else delete state.calendarNotes[iso];
  saveState();
}
function tickLive(){
  const el=$('#tl-count'); if(!el)return;
  if(cal.mode!=='day'||cal.d!==todayISO()){el.textContent='';return;}
  const ni=nextLessonInfo();
  el.textContent=!ni?'':ni.type==='now'?t('sch_now')+': '+ni.l.subject+' · '+ni.mins+' '+t('sch_min')
    :ni.type==='next'?t('sch_next')+' in '+fmtMins(ni.mins):'';
}
setInterval(tickLive,1000);

/* ============================================================
   SECTION 13 — GOALS screen
   ============================================================ */
let goalFilter='all', expandedGoal=null;
function typeLabel(g){ return g.type==='one'?t('t_one'):g.type==='daily'?t('t_daily'):g.type==='weekly'?t('t_weekly'):g.type==='monthly'?t('t_monthly'):t('t_cum'); }
function barColorFor(pct,behind){
  if(behind)return 'var(--amber)';
  if(pct>=100)return 'var(--accent)';
  if(pct>=60)return 'var(--accent)';
  if(pct>0)return 'var(--soft)';
  return '#2a5c3c';
}
function goalRowHTML(g){
  const td=todayISO();
  const {pct,ctx,r}=goalPercent(g);
  const bs=behindSchedule(g);
  const cat=state.categories.find(c=>c.id===g.cat)||{color:'#7fa38c',name:''};
  const col=g.color||cat.color;
  const hard=g.hardFlagFrom&&pct<100&&td>=g.hardFlagFrom;
  const late=g.deadline&&pct<100&&td>g.deadline;
  const open=expandedGoal===g.id;
  const icon=g.main?'<span class="mini-tag main">'+t('main_tag')+'</span>':'';
  const doneTag=g.doneManual?'<span class="mini-tag main" style="color:var(--accent)">✓ '+t('go_done_g')+'</span>':'';
  const hardTag=hard?'<span class="mini-tag hard">'+t('go_hard')+(late?'':' · '+daysBetween(td,g.deadline)+t('d_short'))+'</span>':'';
  const lateTag=late?'<span class="mini-tag over">+'+Math.abs(daysBetween(g.deadline,td))+'d '+t('dash_overdue')+'</span>':'';
  const skIcons=(g.skills||[]).map(sid=>{const s=state.skills.find(x=>x.id===sid);return s?s.icon:'';}).join(' ');
  let head='<div class="goal-head" onclick="toggleExpand(\''+g.id+'\')" title="нажми — откроются связанные задачи и описание цели">'+
    '<span class="gdot" style="background:'+col+'"></span>'+
    '<span class="pbadge">P'+g.priority+'</span>'+
    '<span class="gtitle" ondblclick="inlineEditGoal(\''+g.id+'\',this)" title="double-click to rename">'+esc(g.title)+'</span>'+icon+doneTag+hardTag+lateTag+
    '<span class="goal-bar"><i style="width:'+pct+'%;background:'+barColorFor(pct,!!bs)+'"></i></span>'+
    '<span class="goal-pct'+(bs?' amber':'')+'">'+pct+'%</span>'+
    '<span class="gactions">'+
      (bs?'<button class="mini-btn" style="color:var(--amber);border-color:rgba(255,179,0,.5)" onclick="event.stopPropagation();replanModal(\''+g.id+'\')">'+t('go_replan')+'</button>':'')+
      '<button class="mini-btn" onclick="event.stopPropagation();quickAdd(null,\''+g.id+'\')">'+t('uf_addtask')+'</button>'+
      '<button class="mini-btn" onclick="event.stopPropagation();goalModal(\''+g.id+'\')">✎</button>'+
      '<button class="mini-btn" onclick="event.stopPropagation();toggleExpand(\''+g.id+'\')">'+(open?'▴':'▾')+'</button>'+
    '</span></div>';
  let meta='<div class="goal-meta" onclick="toggleExpand(\''+g.id+'\')">'+
    '<span>'+typeLabel(g)+'</span>'+
    '<span>'+(g.type==='daily'?t('uf_streak')+' 🔥'+ctx.streak:ctx.done+'/'+(g.target||1)+' '+esc(g.unit||''))+'</span>'+
    (g.deadline?'<span>⏱ '+fmtShort(g.deadline)+(g.deadline>=td?' · '+daysBetween(td,g.deadline)+t('d_short'):'')+'</span>':'<span>'+t('per_none_l')+'</span>')+
    (skIcons?'<span>'+skIcons+'</span>':'')+
    (bs?'<span class="amber">'+t('go_behind')+' · '+t('go_needed')+': '+(bs.perDay!=null?bs.perDay.toFixed(2):'?')+' '+esc(g.unit||'')+'</span>':'')+
  '</div>';
  let expand='';
  if(open){
    const tks=state.tasks.filter(x=>x.goalId===g.id).sort(byPrioDate);
    const hist=(g.history||[]).slice(-8).reverse().map(h=>'<div class="kv"><span class="k">'+h.date+'</span><span class="v">'+esc(h.text)+'</span></div>').join('');
    const statUsed=FORMULA_VARS.filter(v=>new RegExp('\\b'+v+'\\b').test(g.formula));
    const stats=statUsed.map(v=>'<span>'+v+' = '+(v==='income'?ctx[v].toFixed(0):Math.round(ctx[v]*100)/100)+'</span>').join('');
    expand='<div class="gexpand">'+
      (g.desc?'<div class="subline" style="margin-bottom:8px">'+esc(g.desc)+'</div>':'')+
      '<div class="kv"><span class="k">'+t('go_formula')+'</span><span class="v acc">'+esc(g.formula)+' '+(r.ok?'→ <span class="glow-soft">'+pct+'%</span>':'<span class="err">⚠ '+esc(r.error)+'</span>')+'</span></div>'+
      (stats?'<div class="gstat">'+stats+'</div>':'')+
      '<div class="wk-sec">'+t('go_tasks')+(tks.length?' · '+tks.filter(x=>x.done).length+'/'+tks.length:'')+
        (tks.length?' <button class="mini-btn" onclick="checkAllTasks(\''+g.id+'\')">'+t('go_check_all')+'</button>':'')+'</div>'+
      (tks.length?tks.map(x=>taskChip(x,{del:true})).join(''):'<div class="subline">'+t('uf_notasks')+'</div>')+
      (hist?'<div class="wk-sec">'+t('go_history')+'</div>'+hist:'')+
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn'+(g.doneManual?'':' btn-primary')+'" onclick="toggleGoalDone(\''+g.id+'\')">'+(g.doneManual?t('go_undone'):t('go_markdone'))+'</button>'+
        '<button class="btn btn-danger" onclick="deleteGoal(\''+g.id+'\')">'+t('go_del_goal')+'</button></div>'+
    '</div>';
  }
  return '<div class="goal-row'+(g.main?' ismain':'')+'" draggable="true" ondragstart="dragGoal(event,\''+g.id+'\')" '+
    'ondragover="event.preventDefault();this.classList.add(\'droptarget\')" ondragleave="this.classList.remove(\'droptarget\')" ondrop="dropGoalOn(event,\''+g.id+'\')">'+
    head+meta+expand+'</div>';
}
function toggleExpand(id){ expandedGoal=expandedGoal===id?null:id; renderView(); }
function checkAllTasks(gid){
  const tks=state.tasks.filter(x=>x.goalId===gid&&!x.done);
  tks.forEach(tk=>{
    tk.done=true; tk.doneAt=todayISO(); tk.updatedAt=Date.now();
    const xp=Math.round(50*(PRIORITY_MULT[tk.priority]||1)*streakMult(globalStreak()));
    tk.xpAwarded=xp; addXP(xp,'task: '+tk.title,{taskId:tk.id});
    const g=state.goals.find(g=>g.id===gid);
    if(g&&g.skills)addSkillXP(g.skills,20,'task');
  });
  if(tks.length)toast(tks.length+' задач выполнено · +XP');
  emitChange();
}
function inlineEditGoal(gid,el){
  const g=state.goals.find(x=>x.id===gid); if(!g)return;
  const input=document.createElement('input');
  input.className='f'; input.value=g.title; input.maxLength=120;
  el.replaceWith(input); input.focus(); input.select();
  let fin=false;
  const done=()=>{ if(fin)return; fin=true; const v=input.value.trim(); if(v&&v!==g.title){g.title=v;g.updatedAt=Date.now();g.history.push({date:todayISO(),text:'renamed'});} emitChange(); };
  input.onkeydown=e=>{ if(e.key==='Enter')done(); if(e.key==='Escape'){fin=true;emitChange();} };
  input.onblur=done;
}
function dragGoal(ev,id){ ev.dataTransfer.setData('text/plain','goal:'+id); ev.stopPropagation(); }
function dropGoalOn(ev,targetId){
  ev.preventDefault(); ev.stopPropagation();
  const raw=ev.dataTransfer.getData('text/plain'); if(!raw.startsWith('goal:'))return;
  const src=raw.slice(5); if(src===targetId)return;
  const arr=state.goals;
  const si=arr.findIndex(g=>g.id===src), ti=arr.findIndex(g=>g.id===targetId);
  if(si<0||ti<0)return;
  const [g]=arr.splice(si,1); arr.splice(ti,0,g);
  emitChange();
}
function deleteGoal(gid){
  const i=state.goals.findIndex(x=>x.id===gid); if(i<0)return;
  const [g]=state.goals.splice(i,1);
  if(expandedGoal===gid)expandedGoal=null;
  emitChange();
  toast('Goal deleted',{amber:true,ms:5000,action:()=>{state.goals.splice(i,0,g);emitChange();}});
}
function toggleGoalDone(gid){ // ручная отметка «цель выполнена» — перекрывает формулу (goalPercent)
  const g=state.goals.find(x=>x.id===gid); if(!g)return;
  g.doneManual=!g.doneManual;
  g.updatedAt=Date.now();
  g.history.push({date:todayISO(),text:g.doneManual?'отмечена выполненной (вручную)':'снята отметка «выполнена»'});
  emitChange();
  toast(g.doneManual?'Цель отмечена выполненной · XP начислен':'Отметка снята · XP не отнимается');
}
function renderGoals(){
  const cats=state.categories.filter(c=>goalFilter==='all'||goalFilter===c.id);
  const chips='<button class="btn'+(goalFilter==='all'?' on':'')+'" onclick="goalFilter=\'all\';renderView()">'+t('go_all')+'</button>'+
    state.categories.map(c=>'<button class="btn'+(goalFilter===c.id?' on':'')+'" onclick="goalFilter=\''+c.id+'\';renderView()">'+esc(c.name)+'</button>').join('');
  let body='', doneList=[];
  for(const c of cats){
    const gs=state.goals.filter(g=>g.cat===c.id).sort(byPrioDate);
    const active=gs.filter(g=>(g.lastPercent||0)<100);
    doneList=doneList.concat(gs.filter(g=>(g.lastPercent||0)>=100));
    if(!gs.length&&goalFilter!=='all')continue;
    body+='<div class="cat-head"><span class="cn">'+esc(c.name)+'</span><span class="subline">'+active.length+'</span></div>'+
      (active.length?active.map(goalRowHTML).join(''):'<div class="subline" style="margin-bottom:12px"активных целей нет</div>');
  }
  if(doneList.length) body+='<div class="cat-head"><span class="cn" style="color:var(--dim)">'+t('go_archive')+'</span><span class="subline">'+doneList.length+'</span></div>'+
    doneList.map(goalRowHTML).join('');
  const doneN=state.goals.filter(g=>(g.lastPercent||0)>=100).length;
  return '<div class="toolbar">'+chips+'<span class="sp"></span>'+
    '<span class="subline">'+state.goals.length+' целей · '+doneN+' '+t('go_done_g')+'</span>'+
    '<button class="btn" onclick="bulkModal()">'+t('go_bulk')+'</button>'+
    '<button class="btn btn-primary" onclick="goalModal(null)">'+t('go_add')+'</button></div>'+body;
}

function completionByDay(from,to){
  const out=[];
  for(let iso=from;iso<=to;iso=addDays(iso,1)){
    const tks=dayTasks(iso);
    const dn=tks.filter(x=>x.done).length;
    out.push({x:iso.slice(5), y:tks.length?Math.round(dn/tks.length*100):null, t:tks.length?Math.round(dn/tks.length*100)+'% · '+dn+'/'+tks.length:null});
  }

function avgCompletion(from,to){

}
function completionByWeek(n){
  const td=todayISO(); const out=[];
  for(let i=n-1;i>=0;i--){
    const ws=addDays(startOfWeekISO(td),-7*i), we=addDays(ws,6);
    const tks=state.tasks.filter(x=>x.date>=ws&&x.date<=we);
    out.push({label:'W'+isoWeek(fromISO(ws)), val:tks.length?Math.round(tks.filter(x=>x.done).length/tks.length*100):null});
  }

function completionByMonth(n){
  const now=new Date(); const out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const y=d.getFullYear(), m=d.getMonth()+1;
    const tks=state.tasks.filter(x=>x.date.startsWith(y+'-'+pad2(m)));
    out.push({label:t('mo')[m-1], val:tks.length?Math.round(tks.filter(x=>x.done).length/tks.length*100):null});

}

let finTab='overview';
/* ---------- FinTrackAdapter — isolated integration layer.
   The app works fully without FinTrack connected.
   To adapt to the real FinTrack API:
   1) Fill Settings ▸ FinTrack: API base URL + Bearer token.
   2) If remote field names differ, edit the mapping table in Settings
      (remote ← local) — mapIn/mapOut below apply it.
   3) Adjust endpoint paths inside pull()/push() if needed
      (default: GET/POST {baseUrl}/transactions).
   Record schema: {id, date(YYYY-MM-DD), amount(>0), currency,
   category, type:'income'|'expense', note}
   ------------------------------------------------------------ */
const FinTrackAdapter={
  status:'NOT_CONNECTED', error:null,
  cfg(){ return state.settings.fintrack||{}; },
  tag(s){ // SYNCED green · ERROR red · otherwise dim
    return s==='SYNCED'?'mini-tag main':s==='ERROR'?'mini-tag over':'mini-tag';
  },
  mapIn(x){ // remote record → local schema (uses settings mapping)
    const m=this.cfg().map||FT_DEFAULT_MAP;
    let amount=parseFloat(String(x[m.amount]??x.amount??'0').replace(',','.'));
    let type=(x[m.type]??x.type??'').toLowerCase();
    if(!isNaN(amount)&&amount<0&&type!=='income'){ type='expense'; amount=Math.abs(amount); }
    if(type!=='income')type='expense';
    return { id:String(x[m.id]??x.id??uid()), date:String(x[m.date]??x.date??'').slice(0,10),
      amount:isNaN(amount)?0:Math.abs(amount), currency:String(x[m.currency]??x.currency??state.settings.currency),
      category:String(x[m.category]??x.category??'Other'), type,
      note:String(x[m.note]??x.note??'') };
  },
  mapOut(tx){ // local → remote (mirror mapping)
    const m=this.cfg().map||FT_DEFAULT_MAP;
    const out={}; out[m.id]=tx.id; out[m.date]=tx.date; out[m.amount]=tx.amount;
    out[m.currency]=tx.currency||state.settings.currency; out[m.category]=tx.category;
    out[m.type]=tx.type; out[m.note]=tx.note||'';
    return out;
  },
  // ---- file exchange (works offline, always available) ----
  exportJSON(){ return JSON.stringify(state.finance.transactions,null,2); },
  exportCSV(){
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    return 'id,date,amount,currency,category,type,note\n'+
      state.finance.transactions.map(x=>[x.id,x.date,x.amount,x.currency||state.settings.currency,x.category,x.type,x.note].map(q).join(',')).join('\n');
  },
  importJSON(text){
    const arr=JSON.parse(text);
    if(!Array.isArray(arr))throw new Error('not an array');
    return mergeTransactions(arr.map(x=>this.mapIn(x)));
  },
  importCSV(text){
    const rows=parseCSV(text);
    if(!rows.length)return 0;
    const head=rows[0].map(h=>h.trim().toLowerCase());
    const idx=n=>head.indexOf(n);
    if(idx('date')<0||idx('amount')<0)throw new Error('CSV needs date+amount columns');
    const items=rows.slice(1).filter(r=>r.length>1).map(r=>this.mapIn({
      id:r[idx('id')], date:r[idx('date')], amount:r[idx('amount')],
      currency:idx('currency')>=0?r[idx('currency')]:'', category:idx('category')>=0?r[idx('category')]:'Other',
      type:idx('type')>=0?r[idx('type')]:'', note:idx('note')>=0?r[idx('note')]:'',
    }));
    return mergeTransactions(items);
  },
  // ---- HTTP sync (example endpoints — adapt to real FinTrack API) ----
  async pull(){
    const cfg=this.cfg();
    if(!cfg.baseUrl){ toast('FinTrack: no base URL (Settings)',{amber:true}); return; }
    try{
      const res=await fetch(cfg.baseUrl.replace(/\/+$/,'')+'/transactions',
        {headers:cfg.token?{'Authorization':'Bearer '+cfg.token}:{}}); // ADAPT path if needed
      if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();
      const items=(Array.isArray(data)?data:data.transactions||[]).map(x=>this.mapIn(x));
      const n=mergeTransactions(items);
      this.status='SYNCED'; this.error=null;
      toast('FinTrack PULL OK · '+n+' merged'); emitChange();
    }catch(e){ this.status='ERROR'; this.error=e.message; toast('FinTrack PULL failed: '+e.message,{amber:true}); renderView(); }
  },
  async push(){
    const cfg=this.cfg();
    if(!cfg.baseUrl){ toast('FinTrack: no base URL (Settings)',{amber:true}); return; }
    try{
      const body=JSON.stringify({items:state.finance.transactions.map(x=>this.mapOut(x))});
      const res=await fetch(cfg.baseUrl.replace(/\/+$/,'')+'/transactions',{method:'POST',
        headers:Object.assign({'Content-Type':'application/json'},cfg.token?{'Authorization':'Bearer '+cfg.token}:{})});
      if(!res.ok)throw new Error('HTTP '+res.status);
      this.status='SYNCED'; this.error=null;
      toast('FinTrack PUSH OK · '+state.finance.transactions.length); renderView();
    }catch(e){ this.status='ERROR'; this.error=e.message; toast('FinTrack PUSH failed: '+e.message,{amber:true}); renderView(); }
  },
  async test(){
    const cfg=this.cfg();
    if(!cfg.baseUrl){ toast('FinTrack: no base URL',{amber:true}); return; }
    try{
      const res=await fetch(cfg.baseUrl.replace(/\/+$/,''),{method:'HEAD'});
      toast('FinTrack TEST: HTTP '+res.status+(res.ok?' OK':''),{amber:!res.ok});
    }catch(e){ toast('FinTrack TEST failed: '+e.message,{amber:true}); }
  },
};
function mergeTransactions(items){ // upsert by id, returns number merged
  let n=0;
  items.forEach(it=>{
    if(!it.date||!(it.amount>0))return;
    const i=state.finance.transactions.findIndex(x=>x.id===it.id);
    if(i>=0)state.finance.transactions[i]={...state.finance.transactions[i],...it};
    else state.finance.transactions.push({id:it.id,date:it.date,amount:it.amount,currency:it.currency||state.settings.currency,category:it.category||'Другое',type:it.type==='income'?'income':'expense',note:it.note||''});
    n++;
  });
  saveState();
  return n;
}
function parseCSV(text){ // minimal quoted-field CSV parser
  const rows=[]; let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(field);field=''; if(row.some(f=>f!==''))rows.push(row); row=[]; }
      else field+=c;
    }
  }
  row.push(field); if(row.some(f=>f!==''))rows.push(row);
  return rows;
}

function ftImport(inp,fmt){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const n=fmt==='json'?FinTrackAdapter.importJSON(r.result):FinTrackAdapter.importCSV(r.result);
      emitChange(); toast(n+' '+t('fin_imported'));

  };
  r.readAsText(f); inp.value='';

function balanceSeries(){
  const tx=state.finance.transactions.slice().sort((a,b)=>a.date<b.date?-1:1);
  const byDate={};
  tx.forEach(x=>{ byDate[x.date]=(byDate[x.date]||0)+(x.type==='income'?x.amount:-x.amount); });
  let cum=0; const out=[];
  Object.keys(byDate).sort().slice(-60).forEach(d=>{ cum+=byDate[d]; out.push({x:d.slice(5),y:Math.round(cum*100)/100,t:fmtMoney(cum)}); });
  return out;
}
/* ---------- recurring monthly transactions (auto-generated) ---------- */
function nextYM(ym){ let y=+ym.slice(0,4),m=+ym.slice(5,7)+1; if(m>12){m=1;y++;} return y+'-'+pad2(m); }
function prevYM(ym){ let y=+ym.slice(0,4),m=+ym.slice(5,7)-1; if(m<1){m=12;y--;} return y+'-'+pad2(m); }
function ensureRecurring(){ // generates due occurrences up to today, marks rule.lastMonth
  if(!state.finance.recurring)return;
  const curYM=finMonth(), td=todayISO();
  let changed=false;
  state.finance.recurring.forEach(r=>{
    if(!r.active)return;
    let ym=r.lastMonth||r.startMonth||curYM, guard=0;
    while(guard++<60){
      if(ym>curYM)break;
      const y=+ym.slice(0,4), m=+ym.slice(5,7);
      const dim=daysInMonth(y,m);
      const day=r.day==='last'?dim:Math.min(r.day,dim);
      const iso=ym+'-'+pad2(day);
      if(iso>td)break; // this month's date not reached yet
      if(!state.finance.transactions.some(x=>x._rId===r.id&&x.date.startsWith(ym))){
        state.finance.transactions.push({id:uid(),date:iso,amount:r.amount,currency:r.currency||state.settings.currency,
          category:r.category,type:r.type,note:(r.note?r.note+' ·':'')+'auto'});
        changed=true;
      }
      r.lastMonth=ym;
      ym=nextYM(ym);
    }
  });
  if(changed)saveState();
}

function sleepHours(e){ let m=minsOf(e.wake)-minsOf(e.bed); if(m<=0)m+=1440; return Math.round(m/60*100)/100; }
function lastNDays(n){ const td=todayISO(); const out=[]; for(let i=n-1;i>=0;i--)out.push(addDays(td,-i)); return out; }
function sleepByDay(n){ return lastNDays(n).map(d=>({date:d,e:state.lifeBalance.sleep.find(x=>x.date===d)})); }
function avgSleep(n){
  const vals=sleepByDay(n).map(x=>x.e?sleepHours(x.e):null).filter(v=>v!=null);
  return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:null;
}
function sleepConsistency(n){ // 100 − 30·σ
  const vals=sleepByDay(n).map(x=>x.e?sleepHours(x.e):null).filter(v=>v!=null);
  if(vals.length<2)return null;
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length);
  return Math.max(0,Math.round(100-sd*30));
}
function weeklyRestMin(){ const days=lastNDays(7); return state.lifeBalance.rest.filter(r=>days.includes(r.date)).reduce((a,r)=>a+(r.minutes||0),0); }
function balanceScore(){
  const target=state.settings.sleepTarget||8;
  const days=sleepByDay(7).filter(x=>x.e);
  const sleepScore=days.length?Math.round(days.reduce((a,x)=>a+Math.max(0,100-Math.abs(sleepHours(x.e)-target)/target*100),0)/days.length):null;
  const restScore=Math.min(100,Math.round(weeklyRestMin()/(state.settings.restTarget||300)*100));
  const work=rangeProgress(addDays(todayISO(),-6),todayISO());
  const parts=[['sleep',sleepScore,0.45],['rest',restScore,0.25],['work',work,0.30]].filter(p=>p[1]!=null);
  const score=parts.length?Math.round(parts.reduce((a,p)=>a+p[1]*p[2],0)/parts.reduce((a,p)=>a+p[2],0)):null;
  return {score,sleepScore,restScore,workScore:work};
}
function awardLifeXp(kind){ // once per day per kind
  const td=todayISO(), lb=state.lifeBalance;
  if(kind==='sleep'&&lb._sleepXpDate!==td){ lb._sleepXpDate=td; addXP(30,'сон: цель достигнута'); }
  if(kind==='rest'&&lb._restXpDate!==td){ lb._restXpDate=td; addXP(20,'отдых ≥30 мин'); }
}
function sleepChart(){
  const target=state.settings.sleepTarget||8;
  const days=sleepByDay(14);
  const vals=days.map(x=>x.e?sleepHours(x.e):0);
  const max=Math.max(target+2,Math.ceil(Math.max(...vals,1))+1);
  const w=460,h=170,padL=30,padB=16,padT=10,padR=8;
  const iw=w-padL-padR, ih=h-padT-padB, n=days.length, bw=iw/n*0.6;
  let out='';
  [0.25,0.5,0.75,1].forEach(p=>{
    const y=padT+ih-ih*p;
    out+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="#1c3a26" stroke-width="1" stroke-dasharray="2 3"/>'+
      '<text x="'+(padL-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="#7fa38c">'+Math.round(max*p)+'h</text>';
  });
  days.forEach((x,i)=>{
    const v=vals[i];
    const x0=padL+i*iw/n+(iw/n-bw)/2;
    const hh=v>0?Math.max(2,v/max*ih):1;
    const y=padT+ih-hh;
    const col=!x.e?'#141f18':v>=target?'#00ff7f':v>=target-2?'#39d98a':'#ffb300';
    out+='<rect x="'+x0.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+col+'" opacity="0.85"><title>'+esc(x.date+' · '+(x.e?v.toFixed(1)+'h · ★'+x.e.quality:'—'))+'</title></rect>'+
      '<text x="'+(x0+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="8" fill="#7fa38c">'+(v>0?v.toFixed(1):'')+'</text>'+
      '<text x="'+(padL+i*iw/n+iw/n/2).toFixed(1)+'" y="'+(h-4)+'" text-anchor="middle" font-size="7" fill="#7fa38c">'+x.date.slice(8)+'</text>';
  });
  const ty=padT+ih-target/max*ih;
  out+='<line x1="'+padL+'" y1="'+ty.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+ty.toFixed(1)+'" stroke="#ffb300" stroke-width="1" stroke-dasharray="5 3"/>'+
    '<text x="'+(w-padR-2)+'" y="'+(ty-4).toFixed(1)+'" text-anchor="end" font-size="8" fill="#ffb300">TARGET '+target+'h</text>';
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:'+w+'px;height:auto">'+out+'</svg>';
}

function hashSeed(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function rngFrom(seed){ let s=seed>>>0; return()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function generateQuests(d){ // deterministic per date — same quests on every reload
  const rand=rngFrom(hashSeed('nexus'+d));
  const target=state.settings.sleepTarget||8;
  const prioGoals=state.goals.filter(g=>g.priority>=4).sort((a,b)=>b.priority-a.priority);
  const pool=[
    {type:'tasks',title:'Выполнить 3 задачи',target:3,xp:40},
    {type:'prio',title:'Выполнить 2 задачи приоритета P4+',target:2,xp:50},
    {type:'sleep',title:'Спать '+target+'ч+',target:target,xp:40},
    {type:'rest',title:'Записать 30+ мин отдыха',target:30,xp:40},
  ];
  if(prioGoals.length){ const g=prioGoals[Math.floor(rand()*prioGoals.length)];
    pool.push({type:'goal',goalId:g.id,title:'Задача под «'+g.title.slice(0,30)+'»',target:1,xp:50}); }
  const n=3+(rand()<0.5?0:rand()<0.85?1:2); // 3..5 quests
  const picked=[],used=new Set();
  while(picked.length<n&&used.size<pool.length){ const i=Math.floor(rand()*pool.length); if(used.has(i))continue; used.add(i); picked.push(pool[i]); }
  return picked;
}
function ensureQuests(d){
  state.rpg.quests=state.rpg.quests||{};
  if(!state.rpg.quests[d]){ state.rpg.quests[d]=generateQuests(d); saveState(); }
  return state.rpg.quests[d];
}
function questProgress(q,d){
  const done=state.tasks.filter(x=>x.doneAt===d);
  if(q.type==='tasks')return done.length;
  if(q.type==='prio')return done.filter(x=>x.priority>=4).length;
  if(q.type==='sleep'){ const e=state.lifeBalance.sleep.find(x=>x.date===d); return e?sleepHours(e):0; }
  if(q.type==='rest')return state.lifeBalance.rest.filter(x=>x.date===d).reduce((a,x)=>a+x.minutes,0);
  if(q.type==='goal')return done.filter(x=>x.goalId===q.goalId).length;
  return 0;
}
function rerollQuest(i){ // replace one quest — 1 per day
  const td=todayISO();
  if(state.rpg._rerollDate===td){ toast('Reroll already used today — come back tomorrow',{amber:true}); return; }
  const qs=state.rpg.quests[td]; if(!qs||!qs[i])return;
  const target=state.settings.sleepTarget||8;
  const prioGoals=state.goals.filter(g=>g.priority>=4);
  const pool=[
    {type:'tasks',title:'Complete 3 tasks',target:3,xp:40},
    {type:'prio',title:'Complete 2 high-priority (P4+) tasks',target:2,xp:50},
    {type:'sleep',title:'Sleep '+target+'h+',target:target,xp:40},
    {type:'rest',title:'Log 30+ min of rest',target:30,xp:40},
  ];
  if(prioGoals.length){ const g=prioGoals[Math.floor(Math.random()*prioGoals.length)];
    pool.push({type:'goal',goalId:g.id,title:'Task for "'+g.title.slice(0,30)+'"',target:1,xp:50}); }
  const cand=pool.filter(p=>!qs.some((q,j)=>j!==i&&q.type===p.type&&q.goalId===p.goalId));
  const pick=cand.length?cand[Math.floor(Math.random()*cand.length)]:pool[Math.floor(Math.random()*pool.length)];
  qs[i]={...pick,awarded:false};
  state.rpg._rerollDate=td;
  saveState(); emitChange(); toast('Квест заменён · замена 1/день использована');
}
function processPenalties(){ // once per day: yesterday's missed quests → −5 Discipline each
  const td=todayISO();
  if(state.rpg._penaltyDone===addDays(td,-1))return;
  if(!state.rpg._penaltyDone){ // first ever run: grace — no retroactive penalties
    state.rpg._penaltyDone=addDays(td,-1);
    saveState();
    return;
  }
  let start=addDays(state.rpg._penaltyDone,1);
  let missed=0,days=0;
  for(let d=start;d<td;d=addDays(d,1)){
    const qs=ensureQuests(d);
    missed+=qs.filter(q=>questProgress(q,d)<q.target).length; days++;
  }
  if(state.settings.penalty&&missed>0){
    state.rpg.discipline=Math.max(0,state.rpg.discipline-5*missed); // floor 0, XP/level untouched
    state.rpg.log.push({date:td,text:'ПЕНАЛЬТИ: −'+(5*missed)+' Дисциплина · пропущено квестов: '+missed+' / дней: '+days});
  }
  state.rpg._penaltyDone=addDays(td,-1);
  if(state.rpg.log.length>50)state.rpg.log=state.rpg.log.slice(-50);
  saveState();
}
function rpgStats(){ // derived from last-30d category activity
  const d30=addDays(todayISO(),-29);
  const done30=state.tasks.filter(x=>x.done&&x.doneAt&&x.doneAt>=d30);
  const catOf=x=>{ const g=x.goalId?state.goals.find(g=>g.id===x.goalId):null; return g?g.cat:null; };
  const inCat=c=>done30.filter(x=>catOf(x)===c).length;
  const inc30=state.finance.transactions.filter(x=>x.type==='income'&&x.date>=d30).reduce((a,x)=>a+x.amount,0);
  const avg7=avgSleep(7);
  return {
    intellect:Math.min(100,4*inCat('study')),
    endurance:Math.min(100,4*inCat('phys')+(avg7!=null&&avg7>=(state.settings.sleepTarget||8)?20:0)),
    wealth:Math.min(100,Math.round(inc30/20)),
    creativity:Math.min(100,6*inCat('dev')+(state.lifeBalance.media.some(m=>m.status==='watched')?10:0)),
    discipline:Math.min(100,(state.rpg.discipline||0)+2*globalStreak()),
  };
}
function svgRadar(values,labels,size){
  const cx=size/2,cy=size/2+4,R=size/2-30,n=values.length;
  const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [(cx+r*Math.cos(a)),(cy+r*Math.sin(a))]; };
  let out='';
  [0.25,0.5,0.75,1].forEach(f=>{ out+='<polygon points="'+values.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')+'" fill="none" stroke="#1c3a26"/>'; });
  values.forEach((_,i)=>{ const[x,y]=pt(i,R); out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#1c3a26"/>'; });
  out+='<polygon points="'+values.map((v,i)=>pt(i,R*Math.max(0,Math.min(100,v))/100).map(x=>x.toFixed(1)).join(',')).join(' ')+'" fill="rgba(0,255,127,.15)" stroke="#00ff7f" stroke-width="1.5" style="filter:drop-shadow(0 0 4px rgba(0,255,127,.5))"/>';
  values.forEach((v,i)=>{ const[x,y]=pt(i,R+16); out+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle" font-size="9" fill="#7fa38c">'+labels[i]+' '+Math.round(v)+'</text>'; });
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="width:100%;max-width:'+size+'px;height:auto">'+out+'</svg>';
}

// ---- FinTrack live bridge (active while the FinTrack app is open) ----
let _nexusSyncing=false,_finPushTimer=null;
function finUrl(){
  var u=(state.settings.fintrack.syncUrl||'').trim();
  // телефон: мост FinTrack живёт на ноутбуке — подменяем 127.0.0.1 на адрес ноутбука в LAN
  if(u&&location.protocol.indexOf('http')===0&&u.indexOf('127.0.0.1')!==-1&&location.hostname&&location.hostname!=='127.0.0.1') u=u.replace('127.0.0.1',location.hostname);
  return u;
}
function finStatusText(){
  if(!finUrl())return 'СИНК ВЫКЛ';
  return {'NOT_CONNECTED':'…','SYNCED':'СИНК OK','OFFLINE':'FINTRACK ЗАКРЫТ','ERROR':'ОШИБКА'}[FinTrackAdapter.status]||FinTrackAdapter.status;
}
function updateFinTag(){
  const el=$('#ft-status'); if(!el)return;
  el.textContent=finStatusText();
  el.className='mini-tag'+(FinTrackAdapter.status==='SYNCED'?' main':FinTrackAdapter.status==='ERROR'?' over':'');
}
async function finPull(silent){
  const u=finUrl(); if(!u)return;
  try{
    const res=await fetch(u.replace(/\/+$/,'')+'/api/transactions');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const items=(Array.isArray(data)?data:(data.items||[])).map(x=>FinTrackAdapter.mapIn(x));
    _nexusSyncing=true;
    const n=mergeTransactions(items);
    _REV++; // finance changed → goal percent cache (income var) must refresh
    _nexusSyncing=false;
    FinTrackAdapter.status='SYNCED'; FinTrackAdapter.error=null;
    updateFinTag();
    if(!silent){ toast('FinTrack: синхронизировано · '+n+' записей'); renderView(); }
  }catch(e){
    _nexusSyncing=false;
    FinTrackAdapter.status='OFFLINE'; FinTrackAdapter.error=e.message;
    updateFinTag();
    if(!silent)toast('FinTrack мост недоступен: '+e.message,{amber:true});
  }
}
async function finPush(){
  const u=finUrl(); if(!u)return;
  try{
    const items=state.finance.transactions.map(x=>{ const o=FinTrackAdapter.mapOut(x); delete o.currency; return o; });
    const res=await fetch(u.replace(/\/+$/,'')+'/api/transactions',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    FinTrackAdapter.status='SYNCED'; updateFinTag();
  }catch(e){ FinTrackAdapter.status='OFFLINE'; FinTrackAdapter.error=e.message; updateFinTag(); }
}
function scheduleFinPush(){ // push local finance changes ~1.5s after any edit
  if(_nexusSyncing)return;
  if(!finUrl()||!state.settings.fintrack.autoSync)return;
  clearTimeout(_finPushTimer);
  _finPushTimer=setTimeout(finPush,1500);
}
setInterval(()=>{ if(finUrl()&&state.settings.fintrack.autoSync)finPull(true); },60000);

function statusBuffs(){
  const td=todayISO(); const out=[];
  const gs=globalStreak(); if(gs>=3)out.push({t:'b',h:tf('buff_streak',{n:gs})});
  const done=state.tasks.filter(x=>x.doneAt===td);
  const catOf=x=>{ const g=x.goalId?state.goals.find(g=>g.id===x.goalId):null; return g?g.cat:null; };
  if(done.filter(x=>catOf(x)==='study').length>=3)out.push({t:'b',h:t('buff_study')});
